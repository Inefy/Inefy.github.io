<style>
  :root{ --shell:#6a4fc1; --shell-dark:#523a9e; --gold:#e8b93c; --crimson:#d23b3b; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #2b2140 0%, #17112a 70%);
    font-family:"Courier New", monospace; color:#cfc4f2; padding:14px; user-select:none;
  }
  #shell{
    background:linear-gradient(160deg, var(--shell) 0%, var(--shell-dark) 100%);
    border-radius:18px 18px 48px 18px; padding:16px 18px 20px 18px;
    box-shadow:0 14px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.18);
    width:min(96vw, 460px);
  }
  #screenBezel{
    background:#241d38; border-radius:10px 10px 34px 10px; padding:14px 12px 12px 12px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.7);
  }
  #bezelTop{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #led{ width:9px; height:9px; border-radius:50%; background:var(--crimson); box-shadow:0 0 8px var(--crimson); }
  #bezelTop span{ font-size:9px; letter-spacing:2px; color:#8d80b8; }
  canvas#gb{
    display:block; width:100%; aspect-ratio:160/144; background:#000;
    image-rendering:pixelated; image-rendering:crisp-edges; border-radius:3px;
  }
  #brand{ text-align:center; margin:10px 0 6px; font-weight:bold; font-size:13px; letter-spacing:1px; color:var(--gold);
    text-shadow:0 1px 0 rgba(0,0,0,.5); font-style:italic; }
  #brand small{ color:#cfc4f2; font-style:normal; font-size:9px; letter-spacing:3px; display:block; }
  #controls{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  #dpad{ position:relative; width:108px; height:108px; }
  .dbtn{ position:absolute; width:36px; height:36px; background:#2c2544; border:0; border-radius:6px;
    box-shadow:0 3px 0 #171226; color:#8d80b8; font-size:14px; cursor:pointer; }
  .dbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #171226; }
  #d-up{ left:36px; top:0; } #d-down{ left:36px; top:72px; } #d-left{ left:0; top:36px; } #d-right{ left:72px; top:36px; }
  #d-mid{ position:absolute; left:36px; top:36px; width:36px; height:36px; background:#2c2544; }
  #ab{ display:flex; gap:14px; align-items:center; transform:rotate(-14deg); }
  .rbtn{ width:46px; height:46px; border-radius:50%; border:0; background:radial-gradient(circle at 35% 30%, #e05555, #a12626);
    color:#fff; font-weight:bold; font-family:inherit; font-size:15px; box-shadow:0 4px 0 #6d1717; cursor:pointer; }
  .rbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #6d1717; }
  #startRow{ display:flex; justify-content:center; gap:16px; margin-top:12px; }
  .sbtn{ width:58px; height:14px; border-radius:8px; border:0; background:#2c2544; box-shadow:0 2px 0 #171226;
    color:#8d80b8; font-size:8px; font-family:inherit; letter-spacing:1px; cursor:pointer; }
  .sbtn:active{ transform:translateY(1px); }
  #help{ margin-top:12px; font-size:11px; color:#8d80b8; text-align:center; line-height:1.6; max-width:460px; }
  #help b{ color:#cfc4f2; }
</style>

function typeEffect(atk, defTypes){
  var m = 1;
  for (var i = 0; i < defTypes.length; i++){
    var row = CHART[atk];
    if (row && row[defTypes[i]] !== undefined) m *= row[defTypes[i]];
  }
  return m;
}

// chars: . transparent | 1 dark | 2 mid | 3 light | 4 accent | k black | w white
function mir(rows){
  var out = [];
  for (var i = 0; i < rows.length; i++){
    out.push(rows[i] + rows[i].split("").reverse().join(""));
  }
  return out;
}

// Sprite canvas caches (built at boot; guarded for headless runs)
var monCache = {}, personCache = {}, tileCache = {};
function makeCanvas(w, h){
  var c = document.createElement("canvas"); c.width = w; c.height = h; return c;
}
function renderGrid(grid, pal){
  var c = makeCanvas(16, 16), x = c.getContext("2d");
  for (var r = 0; r < 16; r++){
    var row = grid[r] || "";
    for (var col = 0; col < 16; col++){
      var ch = row[col];
      if (!ch || ch === ".") continue;
      x.fillStyle = pal[ch] || "#f0f";
      x.fillRect(col, r, 1, 1);
    }
  }
  return c;
}
function flipCanvas(c){
  var f = makeCanvas(c.width, c.height), x = f.getContext("2d");
  x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f;
}
function monSprite(id, flip){
  var key = id + (flip ? "F" : "");
  if (!monCache[key]){
    var s = SPECIES[id], colors = PALS[s.pal];
    var pal = { 1:colors[0], 2:colors[1], 3:colors[2], 4:colors[3] || colors[2], k:"#181020", w:"#f8f8f8" };
    var c = renderGrid(SHAPES[s.shape], pal);
    monCache[key] = flip ? flipCanvas(c) : c;
  }
  return monCache[key];
}
function personSprite(who, frame){
  var key = who + "|" + frame;
  if (!personCache[key]){
    var flip = false, fr = frame;
    if (frame === "right0"){ fr = "left0"; flip = true; }
    if (frame === "right1"){ fr = "left1"; flip = true; }
    var p = PEOPLE[who] || PEOPLE.kid;
    var pal = { k:OUTL, h:p.h, s:SKIN, c:p.c, p:p.p, w:"#f8f8f8" };
    var c = renderGrid(PFRAMES[fr], pal);
    personCache[key] = flip ? flipCanvas(c) : c;
  }
  return personCache[key];
}

function px(x, c, X, Y, w, h){ x.fillStyle = c; x.fillRect(X, Y, w, h); }
function makeTileArt(fn, frame){
  var c = makeCanvas(16, 16), x = c.getContext("2d");
  fn(x, frame); return c;
}

}

// ------------------------- MONSTER LOGIC (pure) -------------------------
function expForLv(l){ return l * l * l; }
function statsFor(sp, lv){
  var b = SPECIES[sp].base;
  return {
    max: fl(2 * b[0] * lv / 100) + lv + 10,
    atk: fl(2 * b[1] * lv / 100) + 5,
    def: fl(2 * b[2] * lv / 100) + 5,
    spd: fl(2 * b[3] * lv / 100) + 5
  };
}
function movesAt(sp, lv){
  var out = [], learn = SPECIES[sp].learn;
  for (var i = 0; i < learn.length; i++){
    if (learn[i][0] <= lv && out.indexOf(learn[i][1]) < 0) out.push(learn[i][1]);
  }
  return out.slice(-4);
}
function makeMon(sp, lv){
  var s = statsFor(sp, lv);
  var mv = movesAt(sp, lv).map(function(id){ return { id:id, pp:MOVES[id].pp }; });
  return { sp:sp, lv:lv, exp:expForLv(lv), hp:s.max, max:s.max, atk:s.atk, def:s.def, spd:s.spd,
           status:null, stages:{ atk:0, def:0 }, moves:mv };
}
function recalcMon(m){
  var dmgTaken = m.max - m.hp;
  var s = statsFor(m.sp, m.lv);
  m.max = s.max; m.atk = s.atk; m.def = s.def; m.spd = s.spd;
  m.hp = clamp(s.max - dmgTaken, 0, s.max);
}
function stageMult(st){ return st >= 0 ? (2 + st) / 2 : 2 / (2 - st); }
function calcDamage(a, d, mv){
  if (!mv.p) return { dmg:0, eff:1, crit:false };
  var crit = rnd() < (mv.crit ? 0.125 : 0.0625);
  var atkStage = crit ? Math.max(0, a.stages.atk) : a.stages.atk;
  var defStage = crit ? Math.min(0, d.stages.def) : d.stages.def;
  var atk = a.atk * stageMult(atkStage) * (a.status === "BRN" ? 0.5 : 1);
  var def = Math.max(1, d.def * stageMult(defStage));
  var eff = typeEffect(mv.t, SPECIES[d.sp].types);
  var stab = SPECIES[a.sp].types.indexOf(mv.t) >= 0 ? 1.5 : 1;
  var base = fl(fl(2 * a.lv / 5 + 2) * mv.p * atk / def) / 50 + 2;
  var dmg = fl(base * stab * eff * (crit ? 2 : 1) * (217 + ri(0, 38)) / 255);
  if (eff > 0 && dmg < 1) dmg = 1;
  if (eff === 0) dmg = 0;
  return { dmg:dmg, eff:eff, crit:crit };
}
function catchCheck(mon, ballMult){
  var st = mon.status === "SLP" ? 2 : (mon.status ? 1.5 : 1);
  var a = (3 * mon.max - 2 * mon.hp) * SPECIES[mon.sp].catch * ballMult * st / (3 * mon.max);
  a = Math.min(255, a);
  var caught = rnd() * 255 < a;
  var shakes = caught ? 3 : Math.min(2, fl(a / 100 + rnd() * 1.7));
  return { caught:caught, shakes:shakes };
}
function expGain(loser, isTrainer){
  return Math.max(1, fl(SPECIES[loser.sp].exp * loser.lv / 7 * (isTrainer ? 1.5 : 1)));
}
function firstAlive(party){
  for (var i = 0; i < party.length; i++) if (party[i].hp > 0) return i;
  return -1;
}

// ------------------------- MAP HELPERS -------------------------
function mapW(m){ return MAPS[m].rows[0].length; }
function mapH(m){ return MAPS[m].rows.length; }
function tileAt(m, x, y){
  if (x < 0 || y < 0 || y >= mapH(m) || x >= mapW(m)) return "#";
  return MAPS[m].rows[y][x];
}
function npcPos(n){ return n.at ? n.at() : [n.x, n.y]; }
function npcAt(m, x, y){
  for (var i = 0; i < NPCS.length; i++){
    var n = NPCS[i];
    if (n.m !== m) continue;
    if (n.hide && n.hide()) continue;
    var p = npcPos(n);
    if (p[0] === x && p[1] === y) return n;
  }
  return null;
}
function objectAt(m, x, y){
  for (var i = 0; i < OBJECTS.length; i++){
    var o = OBJECTS[i];
    if (o.m === m && o.x === x && o.y === y) return o;
  }
  return null;
}
function groundItemAt(m, x, y){
  for (var i = 0; i < GROUND_ITEMS.length; i++){
    var g = GROUND_ITEMS[i];
    if (g.m === m && g.x === x && g.y === y && !G.flags.taken[g.id]) return g;
  }
  return null;
}
function warpAt(m, x, y){
  for (var i = 0; i < WARPS.length; i++){
    var w = WARPS[i];
    if (w.m === m && w.x === x && w.y === y) return w;
  }
  return null;
}
function passable(m, x, y){
  var t = tileAt(m, x, y);
  if (SOLID[t]) return false;
  if (x < 0 || y < 0 || x >= mapW(m) || y >= mapH(m)) return false;
  if (npcAt(m, x, y)) return false;
  if (groundItemAt(m, x, y)) return false;
  return true;
}
var DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
function opposite(d){ return { up:"down", down:"up", left:"right", right:"left" }[d]; }

// ------------------------- DIALOG -------------------------
function wrapLine(s, w){
  var words = String(s).split(" "), lines = [], cur = "";
  for (var i = 0; i < words.length; i++){
    var t = cur ? cur + " " + words[i] : words[i];
    if (t.length > w && cur){ lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function paginate(lines){
  var rows = [], pages = [];
  for (var i = 0; i < lines.length; i++){
    var wrapped = wrapLine(lines[i], 24);
    for (var j = 0; j < wrapped.length; j++) rows.push(wrapped[j]);
    // each source line ends its own page pair
    while (rows.length){ pages.push(rows.splice(0, 2)); }
  }
  return pages.length ? pages : [[""]];
}
function say(lines, cb){
  D = { pages:paginate(lines), pi:0, reveal:0, cb:cb || null, ask:null };
}
function ask(prompt, options, cb){
  D = { pages:paginate([prompt]), pi:0, reveal:0, cb:null, ask:{ options:options, idx:0, cb:cb } };
}
function dialogUpdate(){
  var page = D.pages[D.pi];
  var total = page.join("").length;
  if (D.reveal < total){
    D.reveal += 2;
    if (just.a || just.b) D.reveal = total;
    return;
  }
  var last = D.pi === D.pages.length - 1;
  if (D.ask && last){
    if (just.u){ D.ask.idx = (D.ask.idx + D.ask.options.length - 1) % D.ask.options.length; sfx("move"); }
    if (just.d){ D.ask.idx = (D.ask.idx + 1) % D.ask.options.length; sfx("move"); }
    if (just.a){ var a = D.ask, i = a.idx; D = null; sfx("sel"); if (a.cb) a.cb(i); }
    else if (just.b){ var a2 = D.ask; D = null; sfx("back"); if (a2.cb) a2.cb(-1); }
    return;
  }
  if (just.a || just.b){
    sfx("sel");
    if (!last){ D.pi++; D.reveal = 0; }
    else { var cb = D.cb; D = null; if (cb) cb(); }
  }
}

// ------------------------- OVERWORLD -------------------------
function fadeTo(cb){ FADE = { t:0, phase:0, cb:cb }; }
function fadeUpdate(){
  if (!FADE) return false;
  if (FADE.phase === 0){
    FADE.t += 0.12;
    if (FADE.t >= 1){ FADE.t = 1; FADE.phase = 1; if (FADE.cb) FADE.cb(); }
  } else {
    FADE.t -= 0.12;
    if (FADE.t <= 0) FADE = null;
  }
  return true;
}
function doWarp(w){
  sfx("door");
  fadeTo(function(){
    G.map = w.to; G.x = w.tx; G.y = w.ty; G.mv = null;
  });
}
function tryEncounter(){
  var map = MAPS[G.map], t = tileAt(G.map, G.x, G.y);
  if (!map.enc) return;
  var inGrass = t === "T" || (map.floorEnc && t === "C");
  if (!inGrass) return;
  if (G.flags.champion){
    if (G.map === "summit" && !G.flags.got_solgrif && rnd() < 0.02){
      startWildBattle(makeMon("solgrif", 36), { legendFlag:"got_solgrif" }); return;
    }
    if (G.map === "cave" && !G.flags.got_lunaseal && rnd() < 0.02){
      startWildBattle(makeMon("lunaseal", 36), { legendFlag:"got_lunaseal" }); return;
    }
  }
  if (rnd() >= map.enc.rate) return;
  var pool = map.enc.pool, roll = rnd() * 100, acc = 0, sp = pool[0][0];
  for (var i = 0; i < pool.length; i++){ acc += pool[i][1]; if (roll < acc){ sp = pool[i][0]; break; } }
  var lv = ri(map.enc.lv[0], map.enc.lv[1]);
  startWildBattle(makeMon(sp, lv));
}
function arriveStep(){
  G.steps++;
  var w = warpAt(G.map, G.x, G.y);
  if (w){ doWarp(w); return; }
  if (G.party.length && firstAlive(G.party) >= 0) tryEncounter();
}
function interact(){
  var d = DIRS[G.facing], tx = G.x + d[0], ty = G.y + d[1];
  var n = npcAt(G.map, tx, ty);
  if (n){
    n._dir = opposite(G.facing);
    if (n.trainer) trainerTalk(n);
    else if (n.talk) n.talk();
    return;
  }
  var o = objectAt(G.map, tx, ty);
  if (o){ o.talk(); return; }
  var g = groundItemAt(G.map, tx, ty);
  if (g){
    G.flags.taken[g.id] = 1; addItem(g.item, g.n); sfx("item");
    say(["Found " + ITEMS[g.item].n + (g.n > 1 ? " x" + g.n : "") + "!"]);
    return;
  }
  var key = G.map + ":" + tx + "," + ty;
  if (tileAt(G.map, tx, ty) === "S" && SIGNS[key]) say(SIGNS[key]);
}
function owUpdate(){
  if (fadeUpdate()) return;
  if (D){ dialogUpdate(); return; }
  if (MENU){ menuUpdate(); return; }
  G.animT++;
  if (G.mv){
    G.mv.p += held.b ? 4 : 2;
    if (G.mv.p >= TS){
      G.x += DIRS[G.facing][0]; G.y += DIRS[G.facing][1];
      G.mv = null; arriveStep();
    }
    return;
  }
  if (just.s){ MENU = { idx:0 }; sfx("menu"); return; }
  if (just.a){ interact(); return; }
  var dir = held.u ? "up" : held.d ? "down" : held.l ? "left" : held.r ? "right" : null;
  if (dir){
    if (G.facing !== dir){ G.facing = dir; G.turnT = 4; return; }
    if (G.turnT > 0){ G.turnT--; return; }
    var dd = DIRS[dir], nx = G.x + dd[0], ny = G.y + dd[1];
    if (passable(G.map, nx, ny)) G.mv = { p:0 };
    else if (warpAt(G.map, nx, ny) && !SOLID[tileAt(G.map, nx, ny)]) G.mv = { p:0 };
  }
}

// ------------------------- START MENU / BAG / PARTY / SHOP -------------------------
var MENU_ITEMS = ["MONSTERS", "DEX", "BAG", "SAVE", "EXIT"];
function menuUpdate(){
  if (just.u){ MENU.idx = (MENU.idx + MENU_ITEMS.length - 1) % MENU_ITEMS.length; sfx("move"); }
  if (just.d){ MENU.idx = (MENU.idx + 1) % MENU_ITEMS.length; sfx("move"); }
  if (just.b || (just.s && !just.a)){ MENU = null; sfx("back"); return; }
  if (just.a){
    sfx("sel");
    var pick = MENU_ITEMS[MENU.idx];
    if (pick === "MONSTERS"){
      if (!G.party.length){ MENU = null; say(["You have no monsters yet!"]); return; }
      MENU = null; PT = { mode:"view", idx:0 }; G.state = "party";
    } else if (pick === "DEX"){
      MENU = null; DEXUI = { idx:0 }; G.state = "dex";
    } else if (pick === "BAG"){
      MENU = null; BAG = { idx:0, inBattle:false }; G.state = "bag";
    } else if (pick === "SAVE"){
      MENU = null;
      say(saveGame() ? ["Game saved!"] : ["Save failed! (storage unavailable)"]);
    } else MENU = null;
  }
}
function bagList(){
  var out = [];
  for (var i = 0; i < ITEM_ORDER.length; i++) if (G.bag[ITEM_ORDER[i]]) out.push(ITEM_ORDER[i]);
  return out;
}
function bagUpdate(){
  var list = bagList();
  if (!list.length){ if (just.a || just.b){ closeBag(); } return; }
  BAG.idx = clamp(BAG.idx, 0, list.length - 1);
  if (just.u){ BAG.idx = (BAG.idx + list.length - 1) % list.length; sfx("move"); }
  if (just.d){ BAG.idx = (BAG.idx + 1) % list.length; sfx("move"); }
  if (just.b){ closeBag(); sfx("back"); return; }
  if (just.a){
    var id = list[BAG.idx]; sfx("sel");
    if (BAG.inBattle){ battleUseItem(id); return; }
    if (id === "orb" || id === "greatorb"){ say(["No wild monster to throw it at!"]); return; }
    if (!G.party.length){ say(["You have no monsters!"]); return; }
    PT = { mode:"item", idx:0, item:id, ret:"bag" }; G.state = "party";
  }
}
function closeBag(){ BAG = null; G.state = B ? "battle" : "overworld"; }
function applyItemTo(mon, id){
  if (id === "potion" || id === "superpotion"){
    if (mon.hp <= 0 || mon.hp >= mon.max) return null;
    var amt = id === "potion" ? 20 : 50;
    var before = mon.hp;
    mon.hp = clamp(mon.hp + amt, 0, mon.max);
    return SPECIES[mon.sp].name + " recovered " + (mon.hp - before) + " HP!";
  }
  if (id === "fullheal"){
    if (!mon.status || mon.hp <= 0) return null;
    mon.status = null; mon.slp = 0;
    return SPECIES[mon.sp].name + " is cured!";
  }
  if (id === "revive"){
    if (mon.hp > 0) return null;
    mon.hp = fl(mon.max / 2); mon.status = null; mon.slp = 0;
    return SPECIES[mon.sp].name + " came back to its senses!";
  }
  return null;
}
function partyUpdate(){
  var n = G.party.length;
  if (just.u){ PT.idx = (PT.idx + n - 1) % n; sfx("move"); }
  if (just.d){ PT.idx = (PT.idx + 1) % n; sfx("move"); }
  if (just.b){
    if (PT.forced) return; // must send out a new monster
    sfx("back");
    if (PT.mode === "item" && PT.ret === "bag"){ G.state = "bag"; PT = null; return; }
    if (PT.mode === "switch" && PT.ret === "battle"){ G.state = "battle"; PT = null; battleMenuBack(); return; }
    if (PT.mode === "item" && PT.ret === "battle"){ G.state = "battle"; PT = null; BAG = null; battleMenuBack(); return; }
    PT = null; G.state = "overworld"; return;
  }
  if (just.a){
    var mon = G.party[PT.idx];
    if (PT.mode === "view"){
      if (PT.idx === 0){ sfx("sel"); showMonSummary(mon); return; }
      var tmp = G.party[0]; G.party[0] = G.party[PT.idx]; G.party[PT.idx] = tmp;
      PT.idx = 0; sfx("sel");
    } else if (PT.mode === "item"){
      var msg = applyItemTo(mon, PT.item);
      if (!msg){ sfx("back"); return; }
      takeItem(PT.item); sfx("heal");
      if (PT.ret === "battle"){ PT = null; BAG = null; G.state = "battle"; battleItemUsed(msg); }
      else { PT = null; G.state = "overworld"; say([msg]); }
    } else if (PT.mode === "switch"){
      if (mon.hp <= 0 || PT.idx === B.pi){ sfx("back"); return; }
      var pick = PT.idx; PT = null; G.state = "battle"; sfx("sel");
      battleSwitchTo(pick);
    }
  }
}
function showMonSummary(mon){
  var s = SPECIES[mon.sp];
  var mvs = mon.moves.map(function(m){ return MOVES[m.id].n; }).join(", ");
  say([s.name + "  Lv" + mon.lv + "  " + s.types.join("/"),
       "HP " + mon.hp + "/" + mon.max + "  ATK " + mon.atk + "  DEF " + mon.def + "  SPD " + mon.spd,
       "Moves: " + mvs, s.dex]);
}
function openShop(){ SH = { idx:0 }; G.state = "shop"; }
function shopUpdate(){
  var n = SHOP_STOCK.length + 1;
  if (just.u){ SH.idx = (SH.idx + n - 1) % n; sfx("move"); }

// ------------------------- BATTLE SYSTEM -------------------------
function qtxt(s){ return { t:"txt", s:s }; }
function qfn(f){ return { t:"fn", f:f }; }
function qput(){ for (var i = 0; i < arguments.length; i++) B.q.push(arguments[i]); }
function qins(){ // insert at the current queue position (fn steps have already advanced qi past themselves)
  var args = Array.prototype.slice.call(arguments);
  args.unshift(B.qi, 0);
  B.q.splice.apply(B.q, args);
}
function pmon(){ return G.party[B.pi]; }
function emon(){ return B.eparty[B.ei]; }
function mname(m){ return SPECIES[m.sp].name; }
function effSpd(m){ return m.spd * (m.status === "PAR" ? 0.5 : 1); }
function resetBattleMon(m){ m.stages = { atk:0, def:0 }; }

function startWildBattle(mon, opts){
  opts = opts || {};
  G.dexSeen[mon.sp] = 1;
  var pi = firstAlive(G.party);
  if (pi < 0) return;
  B = { wild:true, legendFlag:opts.legendFlag || null, trainer:null, trainerId:null, eparty:[mon], ei:0, pi:pi,
        q:[], qi:0, phase:"q", afterQ:"menu", menuIdx:0, moveIdx:0, runTries:0,
        evolveQueue:[], over:false, onEnd:opts.onEnd || null, pFlash:0, eFlash:0, introT:20 };
  resetBattleMon(mon); resetBattleMon(G.party[pi]);
  G.state = "battle"; sfx("battle");
  qput(qtxt((opts.legendFlag ? "" : "Wild ") + mname(mon) + " appeared!"), qtxt("Go! " + mname(G.party[pi]) + "!"));
}
function startTrainerBattle(id, onEnd){
  var tr = TRAINERS[id];
  var pi = firstAlive(G.party);
  if (pi < 0) return;
  var ep = tr.party().map(function(p){ var m = makeMon(p[0], p[1]); G.dexSeen[p[0]] = 1; return m; });
  B = { wild:false, trainer:tr, trainerId:id, eparty:ep, ei:0, pi:pi,
        q:[], qi:0, phase:"q", afterQ:"menu", menuIdx:0, moveIdx:0, runTries:0,
        evolveQueue:[], over:false, onEnd:onEnd || null, pFlash:0, eFlash:0, introT:20 };
  resetBattleMon(ep[0]); resetBattleMon(G.party[pi]);
  G.state = "battle"; sfx("battle");
  qput(qtxt(tr.name + " wants to battle!"),
       qtxt(tr.name + " sent out " + mname(ep[0]) + "!"),
       qtxt("Go! " + mname(G.party[pi]) + "!"));
}
function trainerTalk(n){
  var id = n.trainer, tr = TRAINERS[id];
  if (G.flags["beat_" + id]){ say(tr.after || [tr.name + ": Good battle!"]); return; }
  if (!G.party.length || firstAlive(G.party) < 0){
    say([tr.name + ": Come back when your team can fight!"]); return;
  }
  say(tr.intro || [tr.name + " wants to battle!"], function(){ startTrainerBattle(id, null); });
}

function enemyPick(em, pm){
  var usable = [];
  for (var i = 0; i < em.moves.length; i++) if (em.moves[i].pp > 0) usable.push(em.moves[i].id);
  if (!usable.length) return "struggle";
  var best = usable[0], bestScore = -1;
  for (var j = 0; j < usable.length; j++){
    var mv = MOVES[usable[j]];
    var score = mv.p
      ? mv.p * typeEffect(mv.t, SPECIES[pm.sp].types) * (SPECIES[em.sp].types.indexOf(mv.t) >= 0 ? 1.5 : 1)
      : 25;
    if (score > bestScore){ bestScore = score; best = usable[j]; }
  }
  return rnd() < 0.7 ? best : usable[ri(0, usable.length - 1)];
}
function decPP(m, id){
  for (var i = 0; i < m.moves.length; i++) if (m.moves[i].id === id){ m.moves[i].pp = Math.max(0, m.moves[i].pp - 1); }
}
function hasPP(m){
  for (var i = 0; i < m.moves.length; i++) if (m.moves[i].pp > 0) return true;
  return false;
}

// Executes one side's move immediately; inserts result texts after current step.
function execMoveNow(user, target, mvId, userIsPlayer){
  if (B.over || user.hp <= 0 || target.hp <= 0) return;
  var out = [];
  if (user.status === "SLP"){
    user.slp = (user.slp || 1) - 1;
    if (user.slp > 0){ qins(qtxt(mname(user) + " is fast asleep!")); return; }
    user.status = null;
    out.push(qtxt(mname(user) + " woke up!"));
  }
  if (user.status === "PAR" && rnd() < 0.25){
    qins(qtxt(mname(user) + " is fully paralyzed!"));
    return;
  }
  var mv = MOVES[mvId];
  decPP(user, mvId);
  out.push(qtxt(mname(user) + " used " + mv.n + "!"));
  if (mv.a < 999 && rnd() * 100 >= mv.a){
    out.push(qtxt("The attack missed!"));
    qins.apply(null, out); return;
  }
  if (mv.p){
    var r;
    if (mv.fixed){
      var fEff = typeEffect(mv.t, SPECIES[target.sp].types);
      r = { dmg: fEff === 0 ? 0 : user.lv, eff: fEff === 0 ? 0 : 1, crit:false };
    } else r = calcDamage(user, target, mv);
    target.hp = clamp(target.hp - r.dmg, 0, target.max);
    if (userIsPlayer) B.eFlash = 12; else B.pFlash = 12;
    sfx(r.eff > 1 ? "hit2" : "hit");
    if (r.eff === 0) out.push(qtxt("It doesn't affect " + mname(target) + "..."));
    else {
      if (r.crit) out.push(qtxt("A critical hit!"));
      if (r.eff > 1) out.push(qtxt("It's super effective!"));
      if (r.eff < 1) out.push(qtxt("It's not very effective..."));
    }
    if (mv.recoil && r.dmg > 0){
      user.hp = clamp(user.hp - Math.max(1, fl(r.dmg * mv.recoil)), 0, user.max);
      out.push(qtxt(mname(user) + " is hurt by recoil!"));
    }
    if (mv.drain && r.dmg > 0 && user.hp > 0){
      user.hp = clamp(user.hp + Math.max(1, fl(r.dmg * mv.drain)), 0, user.max);
      out.push(qtxt(mname(user) + " drained the energy!"));
    }
  }
  if (mv.healSelf){
    if (user.hp >= user.max) out.push(qtxt("But it failed!"));
    else {
      user.hp = clamp(user.hp + fl(user.max * mv.healSelf), 0, user.max);
      out.push(qtxt(mname(user) + " regained health!"));
    }
  }
  if (mv.fx && target.hp > 0){
    var fx = mv.fx;
    if (fx.stat){
      var who = fx.who === "self" ? user : target;
      var cur = who.stages[fx.stat];
      var next = clamp(cur + fx.stage, -6, 6);
      if (next === cur) out.push(qtxt("But it failed!"));
      else {
        who.stages[fx.stat] = next;
        out.push(qtxt(mname(who) + "'s " + (fx.stat === "atk" ? "ATTACK" : "DEFENSE") +
          (fx.stage > 0 ? " rose!" : " fell!")));
      }
    } else if (fx.status){
      if (!target.status && rnd() * 100 < fx.chance){
        target.status = fx.status;
        if (fx.status === "SLP") target.slp = ri(1, 3);
        out.push(qtxt(mname(target) + (fx.status === "SLP" ? " fell asleep!" :
          fx.status === "PAR" ? " is paralyzed!" :
          fx.status === "BRN" ? " was burned!" : " was poisoned!")));
      } else if (!mv.p) out.push(qtxt("But it failed!"));
    }
  }
  // faint checks
  if (target.hp <= 0) out.push(qtxt(mname(target) + " fainted!"), qfn(userIsPlayer ? enemyFainted : playerFainted));
  if (user.hp <= 0 && target.hp > 0) out.push(qtxt(mname(user) + " fainted!"), qfn(userIsPlayer ? playerFainted : enemyFainted));
  qins.apply(null, out);
}
function endOfTurnNow(){
  if (B.over) return;
  var out = [];
  var sides = [[emon(), enemyFainted], [pmon(), playerFainted]];
  for (var i = 0; i < sides.length; i++){
    var m = sides[i][0];
    if (m.hp > 0 && (m.status === "PSN" || m.status === "BRN")){
      var chip = m.status === "PSN" ? fl(m.max / 8) : fl(m.max / 16);
      m.hp = clamp(m.hp - Math.max(1, chip), 0, m.max);
      out.push(qtxt(mname(m) + (m.status === "PSN" ? " is hurt by poison!" : " is hurt by its burn!")));
      if (m.hp <= 0) out.push(qtxt(mname(m) + " fainted!"), qfn(sides[i][1]));
    }
  }
  if (out.length) qins.apply(null, out);
}
function beginTurn(pAction){
  B.q = []; B.qi = 0; B.phase = "q"; B.afterQ = "menu";
  var eMv = enemyPick(emon(), pmon());
  var pAtTurn = pmon(), eAtTurn = emon();
  // a replacement sent out mid-turn must not act with its predecessor's move
  var playerStep, enemyStep = function(){
    if (emon() !== eAtTurn) return;
    execMoveNow(emon(), pmon(), eMv, false);
  };
  var pFirst = true;
  if (pAction.type === "move"){
    playerStep = function(){
      if (pmon() !== pAtTurn) return;
      execMoveNow(pmon(), emon(), pAction.mv, true);
    };
    var pp = MOVES[pAction.mv].pri || 0, ep = MOVES[eMv].pri || 0;
    if (pp !== ep) pFirst = pp > ep;
    else if (effSpd(pmon()) !== effSpd(emon())) pFirst = effSpd(pmon()) > effSpd(emon());
    else pFirst = rnd() < 0.5;
    qput(qfn(pFirst ? playerStep : enemyStep), qfn(pFirst ? enemyStep : playerStep), qfn(endOfTurnNow));
  } else {
    // item/switch/failed-run already queued their own text; enemy then moves
    qput(qfn(enemyStep), qfn(endOfTurnNow));
  }
}

function enemyFainted(){
  if (B.over) return;
  var loser = emon();
  var mon = pmon();
  var gain = expGain(loser, !B.wild);
  var out = [qtxt(mname(mon) + " gained " + gain + " EXP!")];
  mon.exp += gain;
  while (mon.lv < 50 && mon.exp >= expForLv(mon.lv + 1)){
    mon.lv++;
    var oldMax = mon.max;
    var s = statsFor(mon.sp, mon.lv);
    mon.max = s.max; mon.atk = s.atk; mon.def = s.def; mon.spd = s.spd;
    mon.hp = clamp(mon.hp + (s.max - oldMax), 1, s.max);
    out.push(qfn(function(){ sfx("level"); }), qtxt(mname(mon) + " grew to level " + mon.lv + "!"));
    var learn = SPECIES[mon.sp].learn;
    for (var i = 0; i < learn.length; i++){
      if (learn[i][0] !== mon.lv) continue;
      var mvId = learn[i][1], knows = false;
      for (var j = 0; j < mon.moves.length; j++) if (mon.moves[j].id === mvId) knows = true;
      if (knows) continue;
      if (mon.moves.length < 4){
        mon.moves.push({ id:mvId, pp:MOVES[mvId].pp });
        out.push(qtxt(mname(mon) + " learned " + MOVES[mvId].n + "!"));
      } else out.push({ t:"learn", mon:mon, mv:mvId });
    }
    var ev = SPECIES[mon.sp].evolve;
    if (ev && mon.lv >= ev.at){
      var queued = false;
      for (var k = 0; k < B.evolveQueue.length; k++) if (B.evolveQueue[k].mon === mon) queued = true;
      if (!queued) B.evolveQueue.push({ mon:mon, to:ev.to });
    }
  }
  out.push(qfn(nextEnemyOrWin));
  qins.apply(null, out);
}
function nextEnemyOrWin(){
  if (B.over) return;
  if (!B.wild){
    var next = firstAlive(B.eparty);
    if (next >= 0){
      B.ei = next; resetBattleMon(emon());
      qins(qtxt(B.trainer.name + " sent out " + mname(emon()) + "!"));
      return;
    }
  }
  B.over = true;
  var out = [];
  if (!B.wild){
    G.flags["beat_" + B.trainerId] = 1;
    G.money += B.trainer.prize;
    out.push(qtxt(B.trainer.winText || "You won!"),
             qtxt("You got $" + B.trainer.prize + " for winning!"));
  } else if (B.legendFlag){
    G.flags[B.legendFlag] = 1;
    out.push(qtxt(mname(emon()) + " vanished in a flash of light..."));
  }
  out.push(qfn(function(){ battleEnd(true); }));
  qins.apply(null, out);
}
function playerFainted(){
  if (B.over) return;
  var next = firstAlive(G.party);
  if (next >= 0){
    B.awaitSwitch = true;
    qins(qfn(function(){
      G.state = "party"; PT = { mode:"switch", idx:next, ret:"battle", forced:true };
    }));
    return;
  }
  B.over = true;
  qins(qtxt("You have no monsters left!"), qtxt("You blacked out!"),
       qfn(function(){ battleEnd(false); }));
}
function battleSwitchTo(pick){
  var forced = B.awaitSwitch;
  B.awaitSwitch = false;
  B.pi = pick; resetBattleMon(pmon());
  if (forced){
    qins(qtxt("Go! " + mname(pmon()) + "!"));
    B.phase = "q";
  } else {
    beginTurn({ type:"switch" });
    B.q.unshift(qtxt("Go! " + mname(pmon()) + "!"));
  }
}
function battleItemUsed(msg){
  beginTurn({ type:"item" });
  B.q.unshift(qtxt(msg));
}
function battleMenuBack(){ B.phase = "menu"; }
function battleUseItem(id){
  if (id === "orb" || id === "greatorb"){
    if (!B.wild){
      BAG = null; G.state = "battle";
      B.q = [qtxt("You can't catch another trainer's monster!")];
      B.qi = 0; B.phase = "q"; B.afterQ = "menu";
      return;
    }
    takeItem(id);

    throwOrb(id === "greatorb" ? 1.5 : 1);

  }

function throwOrb(mult){
  B.q = []; B.qi = 0; B.phase = "q"; B.afterQ = "menu";
  var res = catchCheck(emon(), mult);
  var out = [qtxt("You threw a " + (mult > 1 ? "GREAT ORB" : "CAPTURE ORB") + "!")];
  for (var i = 0; i < res.shakes; i++) out.push(qtxt("The orb shakes" + "...".slice(0, (i % 3) + 1)));
  if (res.caught){
    B.over = true;
    var caught = emon();
    out.push(qfn(function(){ sfx("catch"); }),
             qtxt("Gotcha! " + mname(caught) + " was caught!"));
    if (G.party.length >= 6) out.push(qtxt(mname(caught) + " was sent to the STORAGE BOX."));
    out.push(qfn(function(){
      caught.stages = { atk:0, def:0 };
      if (G.party.length < 6) G.party.push(caught); else G.storage.push(caught);
      G.dexSeen[caught.sp] = 1; G.dexCaught[caught.sp] = 1;
      if (B.legendFlag) G.flags[B.legendFlag] = 1;
      battleEnd(true);
    }));
    qput.apply(null, out);
  } else {
    out.push(qtxt("Oh no! It broke free!"));
    qput.apply(null, out);
    qput(qfn(function(){ execMoveNow(emon(), pmon(), enemyPick(emon(), pmon()), false); }),
         qfn(endOfTurnNow));
  }
}
function attemptRun(){
  B.runTries++;
  B.q = []; B.qi = 0; B.phase = "q"; B.afterQ = "menu";
  var esc = effSpd(pmon()) >= emon().spd ||
            ri(0, 255) < (effSpd(pmon()) * 128 / Math.max(1, emon().spd) + 30 * B.runTries) % 256;
  if (esc){
    B.over = true;
    qput(qtxt("Got away safely!"), qfn(function(){ battleEnd(true); }));
  } else {
    qput(qtxt("Can't escape!"),
         qfn(function(){ execMoveNow(emon(), pmon(), enemyPick(emon(), pmon()), false); }),
         qfn(endOfTurnNow));
  }
}
function battleEnd(won){
  var trId = B.trainerId, noWhiteout = B.trainer && B.trainer.noWhiteout;
  var evos = won ? B.evolveQueue : [];
  var onEnd = B.onEnd;
  fadeTo(function(){
    B = null; G.state = "overworld";
    var finish = function(){
      if (won){
        if (trId) afterTrainerWin(trId, onEnd);
        else if (onEnd) onEnd(true);
      } else {
        if (noWhiteout){
          healParty();
          if (onEnd) onEnd(false);
        } else whiteout();
      }
    };
    runEvolutions(evos, finish);
  });
}
function afterTrainerWin(id, onEnd){
  var done = function(){ if (onEnd) onEnd(true); };
  if (id === "marlow" && !G.flags.badge){
    G.flags.badge = 1; sfx("fanfare");
    say(["MARLOW handed you the TERRA BADGE!",
         "MARLOW: Show that to the guard east of the city.",
         "MARLOW: MT. EMBER and the SUMMIT await you."], done);
  } else if (id === "aria" && !G.flags.champion){
    G.flags.champion = 1;
    startCredits();
  } else if (id === "kai2"){
    say(["KAI: Fine! Go challenge ARIA at the summit.", "KAI: But don't think this is over!"], done);
  } else done();
}
function whiteout(){
  G.money = fl(G.money / 2);
  healParty();
  G.map = G.healSpot.map; G.x = G.healSpot.x; G.y = G.healSpot.y; G.facing = "down"; G.mv = null;
  say(["Everything went dark...", "You scurried back to safety, and your team was patched up.", "(You dropped half your money!)"]);
}

function battleUpdate(){
  if (fadeUpdate()) return;
  if (!B) return;
  if (B.introT > 0){ B.introT--; return; }
  if (B.pFlash > 0) B.pFlash--;
  if (B.eFlash > 0) B.eFlash--;
  if (B.phase === "q"){
    if (B.qi >= B.q.length){
      B.q = []; B.qi = 0;
      B.phase = B.over ? "q" : B.afterQ;
      if (B.phase === "q") return; // waiting for end fn (shouldn't happen)
      return;
    }
    var item = B.q[B.qi];
    if (item.t === "fn"){ B.qi++; item.f(); return; }
    if (item.t === "learn"){
      if (item.mon.moves.length < 4){
        item.mon.moves.push({ id:item.mv, pp:MOVES[item.mv].pp });
        B.q.splice(B.qi + 1, 0, qtxt(mname(item.mon) + " learned " + MOVES[item.mv].n + "!"));
        B.qi++; return;
      }
      B.learn = { mon:item.mon, mv:item.mv, idx:0 };
      B.phase = "learn"; return;
    }
    // txt
    if (B.reveal === undefined || B.curText !== item.s){ B.curText = item.s; B.reveal = 0; }
    var total = item.s.length;
    if (B.reveal < total){
      B.reveal += 2;
      if (just.a || just.b) B.reveal = total;
      return;
    }
    if (just.a || just.b){ sfx("sel"); B.qi++; B.curText = null; B.reveal = undefined; }
    return;
  }
  if (B.phase === "menu"){
    if (just.u || just.d){ B.menuIdx = (B.menuIdx + 2) % 4; sfx("move"); }
    if (just.l || just.r){ B.menuIdx = B.menuIdx % 2 === 0 ? B.menuIdx + 1 : B.menuIdx - 1; sfx("move"); }
    if (just.a){
      sfx("sel");
      if (B.menuIdx === 0){ // FIGHT
        if (!hasPP(pmon())){ beginTurn({ type:"move", mv:"struggle" }); return; }
        B.phase = "moves"; B.moveIdx = 0;
      } else if (B.menuIdx === 1){ // BAG
        BAG = { idx:0, inBattle:true }; G.state = "bag";
      } else if (B.menuIdx === 2){ // MONS
        PT = { mode:"switch", idx:0, ret:"battle" }; G.state = "party";
      } else { // RUN
        if (B.wild) attemptRun();
        else { B.q = [qtxt("You can't run from a trainer battle!")]; B.qi = 0; B.phase = "q"; B.afterQ = "menu"; }
      }
    }
    return;
  }
  if (B.phase === "moves"){
    var mv = pmon().moves, n = mv.length;
    if (just.u){ B.moveIdx = (B.moveIdx + n - 1) % n; sfx("move"); }
    if (just.d){ B.moveIdx = (B.moveIdx + 1) % n; sfx("move"); }
    if (just.b){ B.phase = "menu"; sfx("back"); return; }
    if (just.a){
      var pick = mv[B.moveIdx];
      if (pick.pp <= 0){ sfx("back"); return; }
      sfx("sel");
      beginTurn({ type:"move", mv:pick.id });
    }
    return;
  }
  if (B.phase === "learn"){
    var opts = B.learn.mon.moves.length + 1; // 4 moves + give up
    if (just.u){ B.learn.idx = (B.learn.idx + opts - 1) % opts; sfx("move"); }
    if (just.d){ B.learn.idx = (B.learn.idx + 1) % opts; sfx("move"); }
    if (just.a){
      sfx("sel");
      var L = B.learn;
      if (L.idx < L.mon.moves.length){
        var oldMv = MOVES[L.mon.moves[L.idx].id].n;
        L.mon.moves[L.idx] = { id:L.mv, pp:MOVES[L.mv].pp };
        B.q.splice(B.qi + 1, 0, qtxt("1, 2 and... poof!"),
          qtxt(mname(L.mon) + " forgot " + oldMv + " and learned " + MOVES[L.mv].n + "!"));
      } else {
        B.q.splice(B.qi + 1, 0, qtxt(mname(L.mon) + " did not learn " + MOVES[L.mv].n + "."));
      }
      B.learn = null; B.phase = "q"; B.qi++;
    }
    return;
  }
}

var cv = null, ctx = null, tick = 0;
function rect(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function box(x, y, w, h){
  rect(x, y, w, h, "#181020");
  rect(x + 1, y + 1, w - 2, h - 2, "#f8f8f0");
  rect(x + 2, y + 2, w - 4, h - 4, "#181020");
  rect(x + 3, y + 3, w - 6, h - 6, "#f8f8f0");
}
function txtDraw(s, x, y, c){ ctx.fillStyle = c || "#181020"; ctx.fillText(String(s).toUpperCase(), x, y); }
function txtCenter(s, y, c){
  var w = ctx.measureText(String(s).toUpperCase()).width;
  txtDraw(s, fl((VW - w) / 2), y, c);
}
function hpBar(x, y, w, frac){
  frac = clamp(frac, 0, 1);
  rect(x - 1, y - 1, w + 2, 5, "#181020");
  rect(x, y, w, 3, "#c8c8b8");
  var c = frac > .5 ? "#48c848" : frac > .2 ? "#e8b93c" : "#e04838";
  rect(x, y, Math.round(w * frac), 3, c);
}
function cursor(x, y){
  ctx.fillStyle = "#181020";
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 5, y + 3); ctx.lineTo(x, y + 6); ctx.fill();
}
function statusColor(st){
  return st === "PSN" ? "#9a4fb0" : st === "PAR" ? "#a8842a" : st === "BRN" ? "#c0502a" : "#606060";
}
function drawPerson(who, dir, step, x, y){
  ctx.drawImage(personSprite(who, dir + (step ? "1" : "0")), x, y);
}
function drawOverworld(){
  rect(0, 0, VW, VH, "#181020");
  var map = MAPS[G.map], indoor = !!map.indoor;
  var W = mapW(G.map) * TS, H = mapH(G.map) * TS;
  var pxp = G.x * TS + (G.mv ? DIRS[G.facing][0] * G.mv.p : 0);
  var pyp = G.y * TS + (G.mv ? DIRS[G.facing][1] * G.mv.p : 0);
  var camX = W <= VW ? -fl((VW - W) / 2) : clamp(pxp - 72, 0, W - VW);
  var camY = H <= VH ? -fl((VH - H) / 2) : clamp(pyp - 64, 0, H - VH);
  var f = (tick >> 4) & 1;
  var x0 = fl(camX / TS), y0 = fl(camY / TS);
  for (var ty = y0; ty <= y0 + 10; ty++){
    for (var tx = x0; tx <= x0 + 11; tx++){
      if (tx < 0 || ty < 0 || tx >= mapW(G.map) || ty >= mapH(G.map)) continue;
      ctx.drawImage(tileArt(map.rows[ty][tx], indoor, f), tx * TS - camX, ty * TS - camY);
    }
  }
  for (var i = 0; i < GROUND_ITEMS.length; i++){
    var g = GROUND_ITEMS[i];
    if (g.m !== G.map || G.flags.taken[g.id]) continue;
    var ix = g.x * TS - camX, iy = g.y * TS - camY;
    rect(ix + 4, iy + 6, 8, 8, "#181020"); rect(ix + 5, iy + 7, 6, 6, "#d23b3b");
    rect(ix + 5, iy + 10, 6, 1, "#181020"); rect(ix + 6, iy + 8, 2, 1, "#f8f8f8");
  }
  for (var j = 0; j < NPCS.length; j++){
    var n = NPCS[j];
    if (n.m !== G.map) continue;
    if (n.hide && n.hide()) continue;
    var p = npcPos(n);
    drawPerson(n.who, n._dir || n.dir, 0, p[0] * TS - camX, p[1] * TS - camY);
  }
  var step = G.mv && G.mv.p < 8 ? 1 : 0;
  drawPerson("player", G.facing, step, pxp - camX, pyp - camY);
  if (!G.mv && tileAt(G.map, G.x, G.y) === "T"){
    ctx.drawImage(tileArt("T", false, f), 0, 8, 16, 8, G.x * TS - camX, G.y * TS - camY + 8, 16, 8);
  }
  if (MENU) drawStartMenu();
}

// ------------------------- EVOLUTION -------------------------
function runEvolutions(list, done){
  if (!list || !list.length){ if (done) done(); return; }
  var item = list.shift();
  var m = item.mon;
  if (!m || m.sp === item.to || m.hp <= 0){ runEvolutions(list, done); return; }
  G.state = "evolve";
  EVO = { mon:m, from:m.sp, to:item.to, t:-1 };
  EVO.next = function(){ EVO = null; G.state = "overworld"; runEvolutions(list, done); };
  say(["What? " + mname(m) + " is evolving!"], function(){ EVO.t = 0; sfx("evolve"); });
}
function evolveUpdate(){
  if (!EVO || EVO.t < 0) return;
  EVO.t++;
  if (EVO.t === 140){
    var m = EVO.mon, oldName = mname(m);
    var oldMax = m.max;
    m.sp = EVO.to;
    G.dexSeen[m.sp] = 1; G.dexCaught[m.sp] = 1;
    var s = statsFor(m.sp, m.lv);
    m.max = s.max; m.atk = s.atk; m.def = s.def; m.spd = s.spd;
    m.hp = clamp(m.hp + (s.max - oldMax), 1, s.max);
    sfx("fanfare");
    say([oldName + " evolved into " + mname(m) + "!"], EVO.next);
  }
}

var AC = null;
function ensureAudio(){
  if (typeof window === "undefined") return;
  try {
    if (!AC && (window.AudioContext || window.webkitAudioContext))
      AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC && AC.state === "suspended") AC.resume();
  } catch (e){}
}
function tone(f, t0, dur, type, vol){
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.value = f;
  g.gain.setValueAtTime(vol || .06, AC.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime + t0); o.stop(AC.currentTime + t0 + dur + .02);
}
function sfx(name){
  if (typeof window === "undefined" || !AC) return;
  try {
    if (name === "move") tone(880, 0, .04);
    else if (name === "sel") tone(1046, 0, .05);
    else if (name === "back") tone(440, 0, .05);
    else if (name === "menu"){ tone(660, 0, .05); tone(880, .05, .05); }
    else if (name === "hit") tone(160, 0, .1, "sawtooth", .09);
    else if (name === "hit2") tone(110, 0, .16, "sawtooth", .11);
    else if (name === "heal"){ tone(660, 0, .07); tone(880, .08, .07); tone(1100, .16, .12); }
    else if (name === "item"){ tone(784, 0, .06); tone(1046, .07, .1); }
    else if (name === "catch"){ tone(523, 0, .07); tone(659, .08, .07); tone(784, .16, .18); }
    else if (name === "level" || name === "fanfare"){ tone(523, 0, .08); tone(659, .09, .08); tone(784, .18, .08); tone(1046, .27, .22); }
    else if (name === "battle"){ tone(196, 0, .11, "sawtooth", .08); tone(147, .12, .11, "sawtooth", .08); tone(98, .24, .18, "sawtooth", .08); }
    else if (name === "door"){ tone(330, 0, .05); tone(262, .06, .07); }
    else if (name === "evolve"){ for (var i = 0; i < 6; i++) tone(400 + i * 120, i * .09, .08); }
  } catch (e){}
}

}

// ------------------------- DATA VALIDATION (headless + dev) -------------------------
function validateData(){
  var errs = [], i, j;
  var known = {};
  for (var t in TILE_ART) known[t] = 1;
  for (var mid in MAPS){
    var rows = MAPS[mid].rows, w = rows[0].length;
    for (var y = 0; y < rows.length; y++){
      if (rows[y].length !== w) errs.push("map " + mid + " row " + y + " width " + rows[y].length + " != " + w);
      for (var x = 0; x < rows[y].length; x++)
        if (!known[rows[y][x]]) errs.push("map " + mid + " unknown tile '" + rows[y][x] + "' at " + x + "," + y);
    }
  }
  for (i = 0; i < WARPS.length; i++){
    var wp = WARPS[i];
    if (!MAPS[wp.m]){ errs.push("warp bad src map " + wp.m); continue; }
    if (!MAPS[wp.to]){ errs.push("warp bad dst map " + wp.to); continue; }
    if (wp.x < 0 || wp.y < 0 || wp.x >= mapW(wp.m) || wp.y >= mapH(wp.m)) errs.push("warp src OOB " + wp.m + " " + wp.x + "," + wp.y);
    var dt = tileAt(wp.to, wp.tx, wp.ty);
    if (SOLID[dt]) errs.push("warp target solid " + wp.to + " " + wp.tx + "," + wp.ty);
  }
  if (DEX_ORDER.length !== 100) errs.push("dex count " + DEX_ORDER.length + " != 100");
  var nameSeen = {};
  for (var sid in SPECIES){
    var sp = SPECIES[sid];
    if (nameSeen[sp.name]) errs.push("dup species name " + sp.name);
    nameSeen[sp.name] = 1;
    if (!sp.learn) errs.push(sid + " missing learnset");
    else for (i = 0; i < sp.learn.length; i++) if (!MOVES[sp.learn[i][1]]) errs.push(sid + " bad move " + sp.learn[i][1]);
    if (sp.evolve && !SPECIES[sp.evolve.to]) errs.push(sid + " bad evolve target " + sp.evolve.to);
    if (!SHAPES[sp.shape]) errs.push(sid + " bad shape " + sp.shape);
    if (!PALS[sp.pal]) errs.push(sid + " bad palette " + sp.pal);
    for (i = 0; i < sp.types.length; i++) if (!TYPE_COLORS[sp.types[i]]) errs.push(sid + " bad type " + sp.types[i]);
    if (movesAt(sid, 5).length < 1) errs.push(sid + " has no moves at lv5");
  }
  for (var shp in SHAPES){
    if (SHAPES[shp].length !== 16) errs.push("shape " + shp + " rows " + SHAPES[shp].length);
    for (i = 0; i < SHAPES[shp].length; i++) if (SHAPES[shp][i].length !== 16) errs.push("shape " + shp + " row " + i + " len " + SHAPES[shp][i].length);
  }
  for (var pf in PFRAMES){
    if (PFRAMES[pf].length !== 16) errs.push("pframe " + pf + " count " + PFRAMES[pf].length);
    for (i = 0; i < PFRAMES[pf].length; i++) if (PFRAMES[pf][i].length !== 16) errs.push("pframe " + pf + " row " + i + " len " + PFRAMES[pf][i].length);
  }
  var starters = ["sproutle", "embercub", "aquafin"];
  for (i = 0; i < starters.length; i++){
    newGame("VAL"); G.flags.starter = starters[i];
    for (var tid in TRAINERS){
      var pt = TRAINERS[tid].party();
      if (!pt.length) errs.push("trainer " + tid + " empty party");
      for (j = 0; j < pt.length; j++){
        if (!SPECIES[pt[j][0]]) errs.push("trainer " + tid + " bad species " + pt[j][0]);
        else { var tm = makeMon(pt[j][0], pt[j][1]); if (!tm.moves.length) errs.push("trainer " + tid + " " + pt[j][0] + " no moves"); }
      }
    }
  }
  for (var em in MAPS){
    var enc = MAPS[em].enc;
    if (!enc) continue;
    var sum = 0;
    for (i = 0; i < enc.pool.length; i++){
      sum += enc.pool[i][1];
      if (!SPECIES[enc.pool[i][0]]) errs.push("enc " + em + " bad species " + enc.pool[i][0]);
    }
    if (sum !== 100) errs.push("enc " + em + " weights sum " + sum);
  }
  newGame("VAL");
  for (i = 0; i < NPCS.length; i++){
    var n = NPCS[i];
    if (!MAPS[n.m]){ errs.push("npc bad map " + n.m); continue; }
    var pp = npcPos(n);
    if (SOLID[tileAt(n.m, pp[0], pp[1])]) errs.push("npc on solid " + n.m + " " + pp[0] + "," + pp[1]);
    if (!PEOPLE[n.who]) errs.push("npc bad palette " + n.who);
    if (n.trainer && !TRAINERS[n.trainer]) errs.push("npc bad trainer " + n.trainer);
  }
  for (i = 0; i < OBJECTS.length; i++)
    if (!MAPS[OBJECTS[i].m]) errs.push("object bad map");
  for (i = 0; i < GROUND_ITEMS.length; i++){
    var gi = GROUND_ITEMS[i];
    if (SOLID[tileAt(gi.m, gi.x, gi.y)]) errs.push("ground item on solid " + gi.id);
    if (!ITEMS[gi.item]) errs.push("ground item bad item " + gi.item);
  }
  for (var sk in SIGNS){
    var pcs = sk.split(":"), xy = pcs[1].split(",");
    if (tileAt(pcs[0], +xy[0], +xy[1]) !== "S") errs.push("sign not on S tile: " + sk);
  }
  for (i = 0; i < SHOP_STOCK.length; i++) if (!ITEMS[SHOP_STOCK[i]]) errs.push("shop bad item");
  G = null;
  return errs;
}
function bfsReach(startMap, sx, sy){
  var seen = {}, stack = [[startMap, sx, sy]];
  seen[startMap + ":" + sx + "," + sy] = 1;
  var dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  while (stack.length){
    var cur = stack.pop(), m = cur[0], x = cur[1], y = cur[2];
    var w = warpAt(m, x, y);
    if (w){
      var wk = w.to + ":" + w.tx + "," + w.ty;
      if (!seen[wk]){ seen[wk] = 1; stack.push([w.to, w.tx, w.ty]); }
    }
    for (var d = 0; d < 4; d++){
      var nx = x + dirs[d][0], ny = y + dirs[d][1];
      var key = m + ":" + nx + "," + ny;
      if (seen[key]) continue;
      if (SOLID[tileAt(m, nx, ny)]) continue;
      if (nx < 0 || ny < 0 || nx >= mapW(m) || ny >= mapH(m)) continue;
      if (npcAt(m, nx, ny)) continue;
      if (groundItemAt(m, nx, ny)) continue;
      seen[key] = 1; stack.push([m, nx, ny]);
    }
  }
  return seen;
}

      assert(settle(), "settled");
      caughtCount = (G.party.length - 1) + G.storage.length;
    }
    assert(G.party.length + G.storage.length >= 3, "caught several (got " + caughtCount + ")");
    if (G.party.length >= 6) assert(true, "party filled");
    assert(G.dexCaught.peckit === 1, "dex caught mark");
  });

  T("trainer battle win awards money + flag", function(){
    newGame("SIM");
    G.party = [makeMon("pyroclaw", 20)];
    var m0 = G.money;
    startTrainerBattle("ben", null);
    autoBattle();
    assert(!B && settle(), "ended");
    assert(G.flags.beat_ben === 1, "flag set");
    assert(G.money === m0 + TRAINERS.ben.prize, "prize money");
  });

  T("losing causes whiteout at heal spot", function(){
    newGame("SIM");
    G.party = [makeMon("nibbly", 3)];
    G.map = "gym"; G.x = 4; G.y = 3;
    G.money = 1000;
    startTrainerBattle("marlow", null);
    autoBattle();
    assert(!B && settle(), "ended");
    assert(G.money === 500, "money halved, got " + G.money);
    assert(G.map === "home", "warped home");
    assert(G.party[0].hp === G.party[0].max, "healed");
  });

  T("rival kai1 loss has no whiteout and continues story", function(){
    newGame("SIM");
    G.flags.starter = "sproutle";
    G.party = [makeMon("sproutle", 1)];
    G.map = "lab"; G.x = 4; G.y = 4;
    var ended = { won:null };
    startTrainerBattle("kai1", function(w){ ended.won = w; });
    G.party[0].hp = 1;
    autoBattle();
    assert(!B && settle(), "ended");
    assert(ended.won === false, "onEnd(false) called");
    assert(G.map === "lab", "no warp");
    assert(G.party[0].hp === G.party[0].max, "party healed");
  });

  T("level up triggers evolution", function(){
    newGame("SIM");
    G.party = [makeMon("embercub", 15)];
    G.party[0].exp = expForLv(16) - 5;
    startWildBattle(makeMon("nibbly", 5));
    autoBattle();
    assert(settle(), "settled through evolve state");
    assert(G.party[0].lv >= 16, "leveled");
    assert(G.party[0].sp === "pyroclaw", "evolved, got " + G.party[0].sp);
    assert(G.dexCaught.pyroclaw === 1, "dex updated");
  });

  T("move learning replaces when full", function(){
    newGame("SIM");
    G.party = [makeMon("embercub", 16)];
    assert(G.party[0].moves.length === 4, "starts with 4 moves");
    G.party[0].exp = expForLv(17) - 5;
    startWildBattle(makeMon("nibbly", 5));
    autoBattle();
    assert(settle(), "settled");
    var has = G.party[0].moves.some(function(mv){ return mv.id === "firefang"; });
    assert(G.party[0].lv >= 17, "leveled to 17, got " + G.party[0].lv);
    assert(has, "learned firefang via replace");
    assert(G.party[0].sp === "pyroclaw", "also evolved");
  });

  T("gym win grants badge", function(){
    newGame("SIM");
    G.party = [makeMon("leviathorn", 30)];
    startTrainerBattle("marlow", null);
    autoBattle();
    assert(!B && settle(), "ended");
    assert(G.flags.beat_marlow === 1 && G.flags.badge === 1, "badge granted");
  });

  T("champion win rolls credits and sets flag", function(){
    newGame("SIM");
    G.flags.starter = "sproutle"; G.flags.badge = 1;
    G.party = [makeMon("infernyx", 40), makeMon("leviathorn", 40)];
    startTrainerBattle("aria", null);
    autoBattle();
    assert(!B, "battle ended");
    var g = 0;
    while ((FADE || D || EVO || CRED || G.state !== "overworld") && g++ < 20000){
      if (D) simPress("a"); else tickUpdate();
    }
    assert(g < 20000, "credits completed");
    assert(G.flags.champion === 1, "champion flag");
    assert(G.state === "overworld" && !CRED, "back to overworld");
  });

  T("altar legendary battle sets flag on KO", function(){
    newGame("SIM");
    G.flags.champion = 1;
    G.party = [makeMon("infernyx", 45)];
    G.map = "cave"; G.x = 7; G.y = 5; G.facing = "up";
    altarTalk();
    var g = 0;
    while (D && g++ < 100) simPress("a");
    assert(B, "battle started from altar");
    autoBattle(8000);
    assert(!B && settle(), "ended");
    assert(G.flags.got_chronowl === 1, "chronowl flag set");
  });

  T("catch formula bounds", function(){
    var m = makeMon("chronowl", 32);
    for (var i = 0; i < 50; i++){
      var r = catchCheck(m, 1.5);
      assert(r.shakes >= 0 && r.shakes <= 3, "shakes range");
    }
    var easy = makeMon("wispbug", 2); easy.hp = 1; easy.status = "SLP";
    var got = false;
    for (var k = 0; k < 200; k++) if (catchCheck(easy, 1.5).caught) got = true;
    assert(got, "easy catch possible");
  });

  T("save/load round trip", function(){
    // localStorage does not exist headless; verify functions fail gracefully
    newGame("SIM");
    assert(saveGame() === false || saveGame() === true, "saveGame returns");
    assert(hasSave() === false, "no save headless");
  });

  console.log(results.join("\n"));
  console.log(dataErrs.length ? "DATA ERRORS:\n" + dataErrs.join("\n") : "DATA OK (" + DEX_ORDER.length + " species, " + Object.keys(MOVES).length + " moves, " + Object.keys(MAPS).length + " maps)");
  if (failCount || dataErrs.length){ console.log("FAILURES: " + failCount); process.exitCode = 1; }
  else console.log("ALL TESTS PASSED");
} else {
  boot();
}
</script>
