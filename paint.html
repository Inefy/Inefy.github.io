<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A browser-based Paint-style image creator from the Inefy fun corner.">
    <title>Web Paint / Inefy Fun Corner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2360a5fa'/%3E%3Cpath d='M16 18h32v8H26v8h18v8H26v4H16z' fill='%23172033'/%3E%3C/svg%3E">
    <style>
      :root {
        --navy-950: #0f1a2d;
        --navy-900: #13213a;
        --blue-600: #2f80ed;
        --blue-100: #eaf3ff;
        --surface: #ffffff;
        --surface-soft: #f8fbff;
        --border: #dbe3ef;
        --border-strong: #b9c7da;
        --text: #172033;
        --muted: #708198;
        --radius-sm: 8px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
        --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.12);
        --shadow-lg: 0 18px 45px rgba(15, 23, 42, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body,
      button,
      input {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(47, 128, 237, 0.42);
        outline-offset: 2px;
      }

      .paint-app {
        display: grid;
        width: 100vw;
        height: 100vh;
        grid-template-rows: 56px 220px minmax(0, 1fr) 40px;
        overflow: hidden;
        color: var(--text);
        background: #f4f7fb;
      }

      .titlebar {
        display: flex;
        height: 56px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 22px;
        color: #ffffff;
        background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand-link {
        min-width: 0;
        color: inherit;
        text-decoration: none;
      }

      .brand,
      .brand-title,
      .window-actions,
      .ribbon-group-body,
      .color-panel,
      .status-left,
      .status-right,
      .status-item,
      .zoom-control {
        display: flex;
        align-items: center;
      }

      .brand {
        gap: 13px;
        font-size: 21px;
        font-weight: 700;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #67e8f9, #60a5fa 45%, #818cf8);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        font-size: 15px;
      }

      .brand-title {
        min-width: 0;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;
      }

      .brand-title strong {
        font-size: 21px;
      }

      .document-name {
        overflow: hidden;
        font-size: 18px;
        font-weight: 500;
        opacity: 0.95;
        text-overflow: ellipsis;
      }

      .title-separator {
        opacity: 0.58;
      }

      .window-actions {
        gap: 12px;
      }

      .window-action {
        width: 36px;
        height: 32px;
        color: #e5edf8;
        background: transparent;
        border: 0;
        border-radius: var(--radius-sm);
        font-size: 17px;
      }

      .window-action:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .ribbon {
        z-index: 2;
        display: grid;
        grid-template-rows: 64px 156px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
      }

      .tabs {
        display: flex;
        align-items: end;
        gap: 28px;
        padding: 0 28px;
        border-bottom: 1px solid #e4eaf3;
      }

      .tab {
        height: 64px;
        padding: 0 4px;
        color: #526174;
        background: transparent;
        border: 0;
        border-bottom: 3px solid transparent;
        font-size: 16px;
        font-weight: 600;
      }

      .tab.is-active {
        color: #0f3b75;
        border-bottom-color: var(--blue-600);
      }

      .ribbon-content {
        display: flex;
        width: 100%;
        align-items: stretch;
        gap: 14px;
        padding: 10px 12px;
        overflow: hidden;
        scrollbar-width: none;
      }

      .ribbon-content::-webkit-scrollbar {
        display: none;
      }

      .ribbon-group {
        display: grid;
        min-width: max-content;
        height: 136px;
        grid-template-rows: 1fr 26px;
        padding: 12px 16px 7px;
        background: linear-gradient(180deg, #ffffff, #fbfdff);
        border: 1px solid #d6dfec;
        border-radius: 12px;
      }

      .paint-app[data-active-tab="view"] .home-only,
      .paint-app[data-active-tab="home"] .view-only {
        display: none;
      }

      .paint-app.is-minimized {
        grid-template-rows: 56px 0 minmax(0, 1fr) 40px;
      }

      .paint-app.is-minimized .ribbon {
        display: none;
      }

      .ribbon-group-body {
        gap: 12px;
        justify-content: center;
      }

      .ribbon-group-label {
        align-self: end;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .command-button,
      .tool-button,
      .shape-button,
      .brush-size-button,
      .mini-command-button,
      .rail-button,
      .zoom-button {
        color: #22324a;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
      }

      .command-button:hover,
      .tool-button:hover,
      .shape-button:hover,
      .brush-size-button:hover,
      .mini-command-button:hover,
      .rail-button:hover,
      .zoom-button:hover {
        background: #f2f7ff;
        border-color: #cfe0f8;
      }

      .tool-button.is-active,
      .shape-button.is-active,
      .brush-size-button.is-active,
      .rail-button.is-active {
        color: #0d4f9c;
        background: var(--blue-100);
        border-color: #7db4ff;
        box-shadow: inset 0 0 0 1px rgba(47, 128, 237, 0.18);
      }

      .command-button {
        display: grid;
        width: 64px;
        height: 82px;
        grid-template-rows: 40px 1fr;
        place-items: center;
        font-size: 14px;
      }

      .command-icon,
      .tool-icon {
        line-height: 1;
      }

      .command-icon {
        font-size: 32px;
      }

      .mini-command-stack {
        display: grid;
        gap: 6px;
      }

      .mini-command-button {
        min-width: 82px;
        height: 28px;
        padding: 0 8px;
        color: #44546a;
        text-align: left;
      }

      .mini-command-button.is-disabled {
        color: #a8b3c4;
        pointer-events: none;
      }

      .mini-command-button:disabled {
        color: #a8b3c4;
        pointer-events: none;
      }

      .tool-button {
        display: grid;
        width: 70px;
        height: 86px;
        grid-template-rows: 42px 1fr;
        place-items: center;
        font-size: 14px;
      }

      .tool-icon {
        font-size: 34px;
      }

      .brush-size-options {
        gap: 6px;
      }

      .brush-size-button {
        display: grid;
        width: 64px;
        height: 60px;
        place-items: center;
      }

      .brush-dot.thin {
        width: 6px;
        height: 6px;
        background: #0f1f35;
        border-radius: 999px;
      }

      .brush-line {
        display: block;
        width: 34px;
        background: #0f1f35;
        border-radius: 999px;
      }

      .brush-line.small {
        height: 4px;
      }

      .brush-line.medium {
        height: 7px;
      }

      .brush-line.large {
        height: 10px;
      }

      .shape-grid {
        display: grid;
        grid-template-columns: repeat(4, 42px);
        grid-auto-rows: 36px;
        gap: 6px;
      }

      .shape-button {
        display: grid;
        width: 46px;
        height: 39px;
        place-items: center;
        font-size: 25px;
      }

      .colors-group {
        width: 470px;
        flex: 0 0 470px;
        min-width: 470px;
      }

      .colors-group .ribbon-group-body {
        justify-content: flex-start;
        min-width: 0;
      }

      .color-panel {
        width: 100%;
        min-width: 0;
        gap: 14px;
      }

      .current-colors {
        flex: 0 0 82px;
        position: relative;
        width: 82px;
        height: 58px;
      }

      .current-color {
        position: absolute;
        width: 44px;
        height: 44px;
        background: #ffffff;
        border: 2px solid #ffffff;
        border-radius: var(--radius-sm);
        box-shadow: 0 0 0 1px #9aa8bc;
      }

      .current-color.primary {
        top: 0;
        left: 0;
        z-index: 2;
        background: #000000;
      }

      .current-color.secondary {
        right: 8px;
        bottom: 0;
      }

      .swatches {
        display: grid;
        flex: 0 0 auto;
        grid-template-columns: repeat(10, 26px);
        grid-auto-rows: 26px;
        gap: 6px;
      }

      .swatch {
        width: 26px;
        height: 26px;
        background: var(--swatch);
        border: 1px solid rgba(15, 23, 42, 0.18);
        border-radius: 6px;
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      .swatch:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.14);
      }

      .swatch.is-active {
        outline: 2px solid var(--blue-600);
        outline-offset: 2px;
      }

      .workspace {
        display: grid;
        min-height: 0;
        grid-template-columns: 94px minmax(0, 1fr);
        background:
          linear-gradient(45deg, rgba(148, 163, 184, 0.1) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(148, 163, 184, 0.1) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(148, 163, 184, 0.1) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(148, 163, 184, 0.1) 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .tool-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 22px 0 0 18px;
      }

      .tool-rail-panel {
        display: grid;
        gap: 9px;
        padding: 9px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      .rail-button {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        font-size: 23px;
      }

      .canvas-scroll {
        display: grid;
        min-width: 0;
        min-height: 0;
        place-items: center;
        overflow: auto;
        padding: 32px 40px;
      }

      .canvas-stage {
        position: relative;
        width: min(1024px, calc(100vw - 220px), calc((100vh - 408px) * 4 / 3));
        min-width: 420px;
        aspect-ratio: 4 / 3;
        background: #ffffff;
        border: 2px solid #cbd6e4;
        border-radius: var(--radius-md);
        box-shadow:
          0 22px 55px rgba(15, 23, 42, 0.16),
          0 3px 10px rgba(15, 23, 42, 0.1);
        transform-origin: center center;
      }

      .canvas-stage::before {
        position: absolute;
        inset: -14px;
        z-index: -1;
        background: var(--surface-soft);
        border: 1px solid #d4deeb;
        border-radius: 16px;
        content: "";
      }

      .canvas-stage::after {
        position: absolute;
        right: -7px;
        bottom: -7px;
        width: 13px;
        height: 13px;
        background: #ffffff;
        border: 1px solid #aebbd0;
        border-radius: 999px;
        content: "";
      }

      #paintCanvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #ffffff;
        border-radius: var(--radius-sm);
        cursor: crosshair;
        touch-action: none;
      }

      .statusbar {
        display: flex;
        height: 40px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 0 16px;
        color: #26364d;
        background: rgba(255, 255, 255, 0.94);
        border-top: 1px solid var(--border);
        font-size: 13px;
      }

      .status-left,
      .status-right {
        min-width: 0;
        gap: 22px;
      }

      .status-item {
        gap: 8px;
        white-space: nowrap;
      }

      .status-divider {
        width: 1px;
        height: 26px;
        background: var(--border);
      }

      .zoom-control {
        gap: 14px;
      }

      .zoom-button {
        width: 28px;
        height: 28px;
        font-size: 18px;
      }

      .zoom-slider {
        width: 170px;
        accent-color: var(--blue-600);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 1100px) {
        .paint-app {
          grid-template-rows: 56px 220px minmax(0, 1fr) 40px;
        }

        .ribbon-content {
          overflow-x: auto;
        }

        .colors-group {
          flex: 0 0 470px;
        }
      }

      @media (max-width: 760px) {
        .paint-app {
          grid-template-rows: 56px 220px minmax(0, 1fr) 40px;
        }

        .brand-title strong {
          font-size: 17px;
        }

        .document-name,
        .title-separator,
        .status-left {
          display: none;
        }

        .workspace {
          grid-template-columns: 82px minmax(0, 1fr);
        }

        .tool-rail {
          padding: 16px 0 0 12px;
        }

        .rail-button {
          width: 38px;
          height: 38px;
        }

        .canvas-scroll {
          padding: 20px;
        }

        .canvas-stage {
          width: min(1024px, calc(100vw - 120px), calc((100vh - 390px) * 4 / 3));
          min-width: 260px;
        }

        .zoom-slider {
          width: 96px;
        }
      }
    </style>
  </head>
  <body>
    <main class="paint-app" aria-label="Paint application" data-active-tab="home">
      <header class="titlebar">
        <a class="brand-link" href="index.html#fun-corner" aria-label="Back to fun corner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">WP</span>
            <span class="brand-title">
              <strong>Web Paint</strong>
              <span class="title-separator">•</span>
              <span class="document-name">Untitled</span>
            </span>
          </div>
        </a>

        <div class="window-actions" aria-label="Window controls">
          <button class="window-action" type="button" id="cloudButton" aria-label="Save status">☁</button>
          <button class="window-action" type="button" id="minimizeButton" aria-label="Minimize">-</button>
          <button class="window-action" type="button" id="fullscreenButton" aria-label="Maximize">□</button>
          <button class="window-action" type="button" id="closeButton" aria-label="Close">×</button>
        </div>
      </header>

      <section class="ribbon" aria-label="Paint toolbar">
        <nav class="tabs" aria-label="Toolbar sections">
          <button class="tab is-active" type="button" data-tab="home">Home</button>
          <button class="tab" type="button" data-tab="view">View</button>
        </nav>

        <div class="ribbon-content">
          <section class="ribbon-group file-group home-only" aria-label="File commands">
            <div class="ribbon-group-body">
              <button class="command-button" id="newCanvasButton" type="button">
                <span class="command-icon" aria-hidden="true">☰</span>
                <span>New</span>
              </button>
              <button class="command-button" id="openButton" type="button">
                <span class="command-icon" aria-hidden="true">📂</span>
                <span>Open</span>
              </button>
              <button class="command-button" id="saveButton" type="button">
                <span class="command-icon" aria-hidden="true">💾</span>
                <span>Save</span>
              </button>
            </div>
            <div class="ribbon-group-label">File</div>
          </section>

          <section class="ribbon-group clipboard-group home-only" aria-label="Clipboard commands">
            <div class="ribbon-group-body">
              <button class="command-button" id="pasteButton" type="button">
                <span class="command-icon" aria-hidden="true">📋</span>
                <span>Paste</span>
              </button>
              <div class="mini-command-stack">
                <button class="mini-command-button" id="cutButton" type="button">✂ Cut</button>
                <button class="mini-command-button" id="copyButton" type="button">⧉ Copy</button>
                <button class="mini-command-button" type="button" data-tool="select">▣ Select</button>
              </div>
            </div>
            <div class="ribbon-group-label">Clipboard</div>
          </section>

          <section class="ribbon-group tools-group home-only" aria-label="Drawing tools">
            <div class="ribbon-group-body">
              <button class="tool-button is-active" type="button" data-tool="pencil">
                <span class="tool-icon" aria-hidden="true">✎</span>
                <span>Pencil</span>
              </button>
              <button class="tool-button" type="button" data-tool="eraser">
                <span class="tool-icon" aria-hidden="true">▱</span>
                <span>Eraser</span>
              </button>
              <button class="tool-button" type="button" data-tool="fill">
                <span class="tool-icon" aria-hidden="true">◒</span>
                <span>Fill</span>
              </button>
              <button class="tool-button" type="button" data-tool="text">
                <span class="tool-icon" aria-hidden="true">A</span>
                <span>Text</span>
              </button>
            </div>
            <div class="ribbon-group-label">Tools</div>
          </section>

          <section class="ribbon-group brush-group home-only" aria-label="Brush size">
            <div class="ribbon-group-body brush-size-options">
              <button class="brush-size-button" type="button" data-size="2" aria-label="2 pixel brush"><span class="brush-dot thin"></span></button>
              <button class="brush-size-button" type="button" data-size="6" aria-label="6 pixel brush"><span class="brush-line small"></span></button>
              <button class="brush-size-button is-active" type="button" data-size="12" aria-label="12 pixel brush"><span class="brush-line medium"></span></button>
              <button class="brush-size-button" type="button" data-size="20" aria-label="20 pixel brush"><span class="brush-line large"></span></button>
            </div>
            <div class="ribbon-group-label">Brush Size</div>
          </section>

          <section class="ribbon-group shapes-group home-only" aria-label="Shapes">
            <div class="ribbon-group-body">
              <div class="shape-grid">
                <button class="shape-button" type="button" data-shape="line" aria-label="Line">╲</button>
                <button class="shape-button" type="button" data-shape="rectangle" aria-label="Rectangle">□</button>
                <button class="shape-button" type="button" data-shape="rounded-rectangle" aria-label="Rounded rectangle">▢</button>
                <button class="shape-button" type="button" data-shape="circle" aria-label="Circle">○</button>
                <button class="shape-button" type="button" data-shape="triangle" aria-label="Triangle">△</button>
                <button class="shape-button" type="button" data-shape="right-triangle" aria-label="Right triangle">◺</button>
                <button class="shape-button" type="button" data-shape="star" aria-label="Star">☆</button>
                <button class="shape-button" type="button" data-shape="polygon" aria-label="Polygon">⬟</button>
              </div>
            </div>
            <div class="ribbon-group-label">Shapes</div>
          </section>

          <section class="ribbon-group colors-group home-only" aria-label="Colors">
            <div class="ribbon-group-body">
              <div class="color-panel">
                <div class="current-colors" aria-label="Selected colors">
                  <span class="current-color primary" id="primaryColorPreview"></span>
                  <span class="current-color secondary"></span>
                </div>
                <div class="swatches" id="swatches" aria-label="Color palette"></div>
              </div>
            </div>
            <div class="ribbon-group-label">Colors</div>
          </section>

          <section class="ribbon-group view-only" aria-label="Zoom controls">
            <div class="ribbon-group-body">
              <button class="command-button" type="button" id="viewZoomOutButton">
                <span class="command-icon" aria-hidden="true">−</span>
                <span>Zoom</span>
              </button>
              <button class="command-button" type="button" id="viewZoomInButton">
                <span class="command-icon" aria-hidden="true">+</span>
                <span>Zoom</span>
              </button>
              <button class="command-button" type="button" id="viewFitButton">
                <span class="command-icon" aria-hidden="true">⛶</span>
                <span>Fit</span>
              </button>
            </div>
            <div class="ribbon-group-label">View</div>
          </section>

          <section class="ribbon-group view-only" aria-label="Canvas view">
            <div class="ribbon-group-body">
              <button class="command-button" type="button" id="resetViewButton">
                <span class="command-icon" aria-hidden="true">100</span>
                <span>Actual</span>
              </button>
              <button class="command-button" type="button" id="fullscreenRibbonButton">
                <span class="command-icon" aria-hidden="true">□</span>
                <span>Full</span>
              </button>
            </div>
            <div class="ribbon-group-label">Canvas</div>
          </section>
        </div>
      </section>

      <section class="workspace">
        <aside class="tool-rail" aria-label="Quick tools">
          <div class="tool-rail-panel">
            <button class="rail-button" type="button" data-tool="select" aria-label="Select">▣</button>
            <button class="rail-button is-active" type="button" data-tool="pencil" aria-label="Pencil">✎</button>
            <button class="rail-button" type="button" data-tool="eraser" aria-label="Eraser">▱</button>
            <button class="rail-button" type="button" data-tool="fill" aria-label="Fill">◒</button>
            <button class="rail-button" type="button" data-tool="text" aria-label="Text">A</button>
            <button class="rail-button" type="button" data-shape="line" aria-label="Line">╲</button>
            <button class="rail-button" type="button" data-shape="rectangle" aria-label="Rectangle">□</button>
            <button class="rail-button" type="button" data-shape="circle" aria-label="Circle">○</button>
            <button class="rail-button" type="button" data-shape="star" aria-label="Star">☆</button>
          </div>

          <div class="tool-rail-panel">
            <button class="rail-button" type="button" id="undoButton" aria-label="Undo">↶</button>
            <button class="rail-button" type="button" id="redoButton" aria-label="Redo">↷</button>
            <button class="rail-button" type="button" id="clearButton" aria-label="Clear canvas">⌫</button>
          </div>
        </aside>

        <div class="canvas-scroll">
          <div class="canvas-stage" id="canvasStage">
            <canvas id="paintCanvas" width="1024" height="768" aria-label="Drawing canvas"></canvas>
          </div>
          <input class="visually-hidden" id="imageOpenInput" type="file" accept="image/*">
        </div>
      </section>

      <footer class="statusbar">
        <div class="status-left">
          <span class="status-item" id="toolStatus">Pencil</span>
          <span class="status-divider"></span>
          <span class="status-item" id="cursorStatus">✣ 0, 0px</span>
          <span class="status-divider"></span>
          <span class="status-item">▣ 1024 × 768px</span>
          <span class="status-divider"></span>
          <span class="status-item">▰ Layer 1</span>
        </div>

        <div class="status-right">
          <div class="zoom-control">
            <button class="zoom-button" id="zoomOutButton" type="button" aria-label="Zoom out">−</button>
            <span id="zoomStatus">100%</span>
            <button class="zoom-button" id="zoomInButton" type="button" aria-label="Zoom in">+</button>
            <input class="zoom-slider" id="zoomInput" type="range" min="50" max="200" value="100" aria-label="Zoom">
            <button class="zoom-button" id="fitButton" type="button" aria-label="Fit canvas">⛶</button>
          </div>
        </div>
      </footer>
    </main>

    <script>
      const paintApp = document.querySelector(".paint-app");
      const canvas = document.querySelector("#paintCanvas");
      const context = canvas.getContext("2d", { willReadFrequently: true });
      const canvasStage = document.querySelector("#canvasStage");
      const toolStatus = document.querySelector("#toolStatus");
      const cursorStatus = document.querySelector("#cursorStatus");
      const zoomStatus = document.querySelector("#zoomStatus");
      const primaryColorPreview = document.querySelector("#primaryColorPreview");
      const zoomInput = document.querySelector("#zoomInput");
      const swatches = document.querySelector("#swatches");
      const newCanvasButton = document.querySelector("#newCanvasButton");
      const openButton = document.querySelector("#openButton");
      const pasteButton = document.querySelector("#pasteButton");
      const saveButton = document.querySelector("#saveButton");
      const clearButton = document.querySelector("#clearButton");
      const undoButton = document.querySelector("#undoButton");
      const redoButton = document.querySelector("#redoButton");
      const cutButton = document.querySelector("#cutButton");
      const copyButton = document.querySelector("#copyButton");
      const cloudButton = document.querySelector("#cloudButton");
      const minimizeButton = document.querySelector("#minimizeButton");
      const fullscreenButton = document.querySelector("#fullscreenButton");
      const closeButton = document.querySelector("#closeButton");
      const imageOpenInput = document.querySelector("#imageOpenInput");
      const zoomOutButton = document.querySelector("#zoomOutButton");
      const zoomInButton = document.querySelector("#zoomInButton");
      const fitButton = document.querySelector("#fitButton");
      const viewZoomOutButton = document.querySelector("#viewZoomOutButton");
      const viewZoomInButton = document.querySelector("#viewZoomInButton");
      const viewFitButton = document.querySelector("#viewFitButton");
      const resetViewButton = document.querySelector("#resetViewButton");
      const fullscreenRibbonButton = document.querySelector("#fullscreenRibbonButton");
      const tabButtons = Array.from(document.querySelectorAll("[data-tab]"));
      const toolButtons = Array.from(document.querySelectorAll("[data-tool]"));
      const shapeButtons = Array.from(document.querySelectorAll("[data-shape]"));
      const sizeButtons = Array.from(document.querySelectorAll("[data-size]"));
      const palette = [
        "#000000", "#ffffff", "#7f1d1d", "#dc2626", "#f97316",
        "#facc15", "#16a34a", "#22c55e", "#0ea5e9", "#2563eb",
        "#1e1b4b", "#7c3aed", "#db2777", "#f9a8d4", "#9ca3af",
        "#475569", "#92400e", "#f5deb3", "#14b8a6", "#a3e635"
      ];
      const state = {
        activeTool: "pencil",
        activeShape: "",
        color: "#000000",
        brushSize: 12,
        brushStyle: "round",
        isDrawing: false,
        history: [],
        historyIndex: -1,
        lastPoint: null,
        startPoint: null,
        draft: null,
        zoom: 100,
        canvasRect: null,
        pendingPoint: null,
        frameRequest: 0
      };
      const maxHistory = 24;
      let cloudTimer = 0;

      function saveHistory() {
        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(context.getImageData(0, 0, canvas.width, canvas.height));
        if (state.history.length > maxHistory) state.history.shift();
        state.historyIndex = state.history.length - 1;
      }

      function restoreHistory(index) {
        const snapshot = state.history[index];
        if (!snapshot) return;
        context.putImageData(snapshot, 0, 0);
      }

      function initializeCanvas() {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        saveHistory();
      }

      function showCloudStatus(label) {
        cloudButton.textContent = label;
        window.clearTimeout(cloudTimer);
        cloudTimer = window.setTimeout(() => {
          cloudButton.textContent = "☁";
        }, 1600);
      }

      function drawImageToCanvas(image) {
        const scale = Math.min(canvas.width / image.width, canvas.height / image.height);
        const width = image.width * scale;
        const height = image.height * scale;
        const x = (canvas.width - width) / 2;
        const y = (canvas.height - height) / 2;

        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, x, y, width, height);
        saveHistory();
      }

      function loadImageBlob(blob) {
        const url = URL.createObjectURL(blob);
        const image = new Image();
        image.onload = () => {
          drawImageToCanvas(image);
          URL.revokeObjectURL(url);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          showCloudStatus("!");
        };
        image.src = url;
      }

      function canvasToBlob() {
        return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      }

      async function copyCanvasToClipboard() {
        const blob = await canvasToBlob();
        if (!blob) return false;

        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          return true;
        }

        downloadCanvas();
        return false;
      }

      async function pasteFromClipboard() {
        if (!navigator.clipboard || !navigator.clipboard.read) {
          imageOpenInput.click();
          return;
        }

        const items = await navigator.clipboard.read();
        for (const item of items) {
          const imageType = item.types.find((type) => type.startsWith("image/"));
          if (imageType) {
            loadImageBlob(await item.getType(imageType));
            return;
          }
        }

        if (navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            configureBrush();
            context.font = `${Math.max(18, state.brushSize * 4)}px Inter, sans-serif`;
            context.fillText(text, 80, 110);
            saveHistory();
            return;
          }
        }

        imageOpenInput.click();
      }

      function getCanvasPoint(event) {
        const rect = state.canvasRect || canvas.getBoundingClientRect();
        return {
          x: Math.round((event.clientX - rect.left) * (canvas.width / rect.width)),
          y: Math.round((event.clientY - rect.top) * (canvas.height / rect.height))
        };
      }

      function configureBrush() {
        const size = state.activeTool === "pencil" ? Math.max(1, Math.round(state.brushSize / 3)) : state.brushSize;
        context.lineWidth = size;
        context.lineCap = state.brushStyle === "round" ? "round" : "butt";
        context.lineJoin = state.brushStyle === "round" ? "round" : "miter";
        context.strokeStyle = state.activeTool === "eraser" ? "#ffffff" : state.color;
        context.fillStyle = state.color;
      }

      function drawLine(fromPoint, toPoint) {
        configureBrush();
        context.beginPath();
        context.moveTo(fromPoint.x, fromPoint.y);
        context.lineTo(toPoint.x, toPoint.y);
        context.stroke();
      }

      function roundedRectPath(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
      }

      function drawShape(fromPoint, toPoint, shape) {
        configureBrush();
        const x = Math.min(fromPoint.x, toPoint.x);
        const y = Math.min(fromPoint.y, toPoint.y);
        const width = Math.abs(toPoint.x - fromPoint.x);
        const height = Math.abs(toPoint.y - fromPoint.y);
        context.beginPath();

        if (shape === "line") {
          drawLine(fromPoint, toPoint);
          return;
        }

        if (shape === "rectangle") {
          context.strokeRect(x, y, width, height);
          return;
        }

        if (shape === "rounded-rectangle") {
          roundedRectPath(x, y, width, height, 18);
        } else if (shape === "circle") {
          context.ellipse(x + width / 2, y + height / 2, width / 2, height / 2, 0, 0, Math.PI * 2);
        } else if (shape === "triangle") {
          context.moveTo(fromPoint.x + (toPoint.x - fromPoint.x) / 2, fromPoint.y);
          context.lineTo(toPoint.x, toPoint.y);
          context.lineTo(fromPoint.x, toPoint.y);
          context.closePath();
        } else if (shape === "right-triangle") {
          context.moveTo(fromPoint.x, fromPoint.y);
          context.lineTo(fromPoint.x, toPoint.y);
          context.lineTo(toPoint.x, toPoint.y);
          context.closePath();
        } else if (shape === "star") {
          const centerX = x + width / 2;
          const centerY = y + height / 2;
          const outer = Math.max(width, height) / 2;
          const inner = outer / 2.3;
          for (let i = 0; i < 10; i += 1) {
            const radius = i % 2 === 0 ? outer : inner;
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const pointX = centerX + Math.cos(angle) * radius;
            const pointY = centerY + Math.sin(angle) * radius;
            if (i === 0) context.moveTo(pointX, pointY);
            else context.lineTo(pointX, pointY);
          }
          context.closePath();
        } else if (shape === "polygon") {
          const centerX = x + width / 2;
          const centerY = y + height / 2;
          const radius = Math.max(width, height) / 2;
          for (let i = 0; i < 6; i += 1) {
            const angle = -Math.PI / 2 + i * Math.PI / 3;
            const pointX = centerX + Math.cos(angle) * radius;
            const pointY = centerY + Math.sin(angle) * radius;
            if (i === 0) context.moveTo(pointX, pointY);
            else context.lineTo(pointX, pointY);
          }
          context.closePath();
        }

        context.stroke();
      }

      function rgbToHex(red, green, blue) {
        return `#${[red, green, blue].map((channel) => channel.toString(16).padStart(2, "0")).join("")}`;
      }

      function hexToRgba(hex) {
        const value = hex.replace("#", "");
        return [
          Number.parseInt(value.slice(0, 2), 16),
          Number.parseInt(value.slice(2, 4), 16),
          Number.parseInt(value.slice(4, 6), 16),
          255
        ];
      }

      function colorsMatch(data, index, target) {
        return data[index] === target[0]
          && data[index + 1] === target[1]
          && data[index + 2] === target[2]
          && data[index + 3] === target[3];
      }

      function floodFill(point) {
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        const data = image.data;
        const startX = Math.max(0, Math.min(canvas.width - 1, point.x));
        const startY = Math.max(0, Math.min(canvas.height - 1, point.y));
        const startIndex = (startY * canvas.width + startX) * 4;
        const target = [
          data[startIndex],
          data[startIndex + 1],
          data[startIndex + 2],
          data[startIndex + 3]
        ];
        const replacement = hexToRgba(state.color);
        if (target.every((value, index) => value === replacement[index])) return false;

        const stack = new Int32Array(canvas.width * canvas.height);
        const visited = new Uint8Array(canvas.width * canvas.height);
        let stackLength = 0;
        const firstPosition = startY * canvas.width + startX;
        stack[stackLength] = firstPosition;
        visited[firstPosition] = 1;
        stackLength += 1;

        while (stackLength) {
          stackLength -= 1;
          const position = stack[stackLength];
          const x = position % canvas.width;
          const y = Math.floor(position / canvas.width);
          if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) continue;
          const index = (y * canvas.width + x) * 4;
          if (!colorsMatch(data, index, target)) continue;
          data[index] = replacement[0];
          data[index + 1] = replacement[1];
          data[index + 2] = replacement[2];
          data[index + 3] = replacement[3];
          if (x + 1 < canvas.width) {
            const next = y * canvas.width + x + 1;
            if (!visited[next]) {
              stack[stackLength] = next;
              visited[next] = 1;
              stackLength += 1;
            }
          }
          if (x > 0) {
            const next = y * canvas.width + x - 1;
            if (!visited[next]) {
              stack[stackLength] = next;
              visited[next] = 1;
              stackLength += 1;
            }
          }
          if (y + 1 < canvas.height) {
            const next = (y + 1) * canvas.width + x;
            if (!visited[next]) {
              stack[stackLength] = next;
              visited[next] = 1;
              stackLength += 1;
            }
          }
          if (y > 0) {
            const next = (y - 1) * canvas.width + x;
            if (!visited[next]) {
              stack[stackLength] = next;
              visited[next] = 1;
              stackLength += 1;
            }
          }
        }

        context.putImageData(image, 0, 0);
        return true;
      }

      function pickColor(point) {
        const pixel = context.getImageData(point.x, point.y, 1, 1).data;
        setColor(rgbToHex(pixel[0], pixel[1], pixel[2]));
      }

      function titleCase(value) {
        return value.split("-").map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join(" ");
      }

      function syncActiveControls() {
        toolButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.tool === state.activeTool && !state.activeShape);
        });
        shapeButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.shape === state.activeShape);
        });
      }

      function setTool(tool) {
        state.activeTool = tool;
        state.activeShape = "";
        toolStatus.textContent = titleCase(tool);
        syncActiveControls();
      }

      function setShape(shape) {
        state.activeTool = "shape";
        state.activeShape = shape;
        toolStatus.textContent = titleCase(shape);
        syncActiveControls();
      }

      function setColor(color) {
        state.color = color;
        primaryColorPreview.style.background = color;
        swatches.querySelectorAll(".swatch").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.color === color);
        });
      }

      function setBrushSize(size) {
        state.brushSize = Number(size);
        sizeButtons.forEach((button) => {
          button.classList.toggle("is-active", Number(button.dataset.size) === state.brushSize);
        });
      }

      function clearCanvas() {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        saveHistory();
      }

      function downloadCanvas() {
        const link = document.createElement("a");
        link.download = "web-paint.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      function setZoom(value) {
        state.zoom = Math.max(50, Math.min(200, Number(value)));
        zoomInput.value = state.zoom;
        canvasStage.style.transform = `scale(${state.zoom / 100})`;
        zoomStatus.textContent = `${state.zoom}%`;
        state.canvasRect = null;
      }

      function saveToBrowserStorage() {
        try {
          localStorage.setItem("webPaintAutosave", canvas.toDataURL("image/png"));
          showCloudStatus("✓");
        } catch {
          showCloudStatus("!");
        }
      }

      async function toggleFullscreen() {
        if (!document.fullscreenElement) {
          await paintApp.requestFullscreen();
          return;
        }

        await document.exitFullscreen();
      }

      function setActiveTab(tab) {
        paintApp.dataset.activeTab = tab;
        tabButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.tab === tab);
        });
      }

      function startDrawing(event) {
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        state.canvasRect = canvas.getBoundingClientRect();
        const point = getCanvasPoint(event);

        if (state.activeTool === "picker") {
          pickColor(point);
          return;
        }

        if (state.activeTool === "fill") {
          if (floodFill(point)) saveHistory();
          return;
        }

        if (state.activeTool === "text") {
          const text = window.prompt("Text to place on the canvas:");
          if (!text) return;
          configureBrush();
          context.font = `${Math.max(16, state.brushSize * 4)}px Inter, sans-serif`;
          context.fillText(text, point.x, point.y);
          saveHistory();
          return;
        }

        if (state.activeTool === "select") return;

        if (!["pencil", "brush", "eraser", "shape"].includes(state.activeTool)) return;
        state.isDrawing = true;
        state.lastPoint = point;
        state.startPoint = point;
        state.draft = context.getImageData(0, 0, canvas.width, canvas.height);
        if (["pencil", "brush", "eraser"].includes(state.activeTool)) drawLine(point, point);
      }

      function continueDrawing(event) {
        const point = getCanvasPoint(event);
        cursorStatus.textContent = `✣ ${point.x}, ${point.y}px`;
        if (!state.isDrawing || !state.lastPoint) return;
        state.pendingPoint = point;

        if (state.frameRequest) return;
        state.frameRequest = window.requestAnimationFrame(() => {
          state.frameRequest = 0;
          renderPendingPoint();
        });
      }

      function renderPendingPoint() {
        const point = state.pendingPoint;
        state.pendingPoint = null;
        if (!point || !state.isDrawing || !state.lastPoint) return;

        if (["pencil", "brush", "eraser"].includes(state.activeTool)) {
          drawLine(state.lastPoint, point);
          state.lastPoint = point;
          return;
        }

        context.putImageData(state.draft, 0, 0);
        if (state.activeTool === "shape") drawShape(state.startPoint, point, state.activeShape);
      }

      function stopDrawing() {
        if (!state.isDrawing) return;
        if (state.frameRequest) {
          window.cancelAnimationFrame(state.frameRequest);
          state.frameRequest = 0;
          renderPendingPoint();
        }
        state.isDrawing = false;
        state.lastPoint = null;
        state.startPoint = null;
        state.draft = null;
        state.canvasRect = null;
        saveHistory();
      }

      function renderPalette() {
        swatches.innerHTML = "";
        palette.forEach((color) => {
          const button = document.createElement("button");
          button.className = "swatch";
          button.type = "button";
          button.dataset.color = color;
          button.style.setProperty("--swatch", color);
          button.setAttribute("aria-label", `Select color ${color}`);
          button.addEventListener("click", () => setColor(color));
          swatches.appendChild(button);
        });
        setColor(state.color);
      }

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => setActiveTab(button.dataset.tab));
      });
      toolButtons.forEach((button) => {
        button.addEventListener("click", () => setTool(button.dataset.tool));
      });
      shapeButtons.forEach((button) => {
        button.addEventListener("click", () => setShape(button.dataset.shape));
      });
      sizeButtons.forEach((button) => {
        button.addEventListener("click", () => setBrushSize(button.dataset.size));
      });

      canvas.addEventListener("pointerdown", startDrawing);
      canvas.addEventListener("pointermove", continueDrawing);
      canvas.addEventListener("pointerup", stopDrawing);
      canvas.addEventListener("pointerleave", stopDrawing);
      canvas.addEventListener("pointercancel", stopDrawing);
      clearButton.addEventListener("click", clearCanvas);
      newCanvasButton.addEventListener("click", clearCanvas);
      openButton.addEventListener("click", () => imageOpenInput.click());
      imageOpenInput.addEventListener("change", () => {
        const [file] = imageOpenInput.files;
        if (file) loadImageBlob(file);
        imageOpenInput.value = "";
      });
      pasteButton.addEventListener("click", async () => {
        try {
          await pasteFromClipboard();
        } catch {
          imageOpenInput.click();
        }
      });
      saveButton.addEventListener("click", downloadCanvas);
      copyButton.addEventListener("click", async () => {
        try {
          await copyCanvasToClipboard();
          showCloudStatus("✓");
        } catch {
          showCloudStatus("!");
        }
      });
      cutButton.addEventListener("click", async () => {
        try {
          await copyCanvasToClipboard();
          clearCanvas();
          showCloudStatus("✓");
        } catch {
          showCloudStatus("!");
        }
      });
      cloudButton.addEventListener("click", saveToBrowserStorage);
      minimizeButton.addEventListener("click", () => {
        paintApp.classList.toggle("is-minimized");
      });
      fullscreenButton.addEventListener("click", async () => {
        try {
          await toggleFullscreen();
        } catch {
          setZoom(100);
        }
      });
      closeButton.addEventListener("click", () => {
        window.location.href = "index.html#fun-corner";
      });
      undoButton.addEventListener("click", () => {
        if (state.historyIndex <= 0) return;
        state.historyIndex -= 1;
        restoreHistory(state.historyIndex);
      });
      redoButton.addEventListener("click", () => {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex += 1;
        restoreHistory(state.historyIndex);
      });
      zoomInput.addEventListener("input", (event) => setZoom(event.target.value));
      zoomOutButton.addEventListener("click", () => setZoom(state.zoom - 10));
      zoomInButton.addEventListener("click", () => setZoom(state.zoom + 10));
      fitButton.addEventListener("click", () => setZoom(100));
      viewZoomOutButton.addEventListener("click", () => setZoom(state.zoom - 10));
      viewZoomInButton.addEventListener("click", () => setZoom(state.zoom + 10));
      viewFitButton.addEventListener("click", () => setZoom(100));
      resetViewButton.addEventListener("click", () => setZoom(100));
      fullscreenRibbonButton.addEventListener("click", async () => {
        try {
          await toggleFullscreen();
        } catch {
          setZoom(100);
        }
      });

      renderPalette();
      initializeCanvas();
      setBrushSize(state.brushSize);
      syncActiveControls();
    </script>
  </body>
</html>
