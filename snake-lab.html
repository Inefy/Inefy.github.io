<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="A polished Snake-style browser mini game from the Inefy fun corner.">
    <title>Snake Lab / Inefy Fun Corner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236de1a6'/%3E%3Cpath d='M16 18h19a13 13 0 0 1 0 26H24v-9h11a4 4 0 0 0 0-8H16z' fill='%230c0f10'/%3E%3Ccircle cx='45' cy='23' r='3' fill='%23f5c45b'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="snake-lab.css">
  </head>
  <body>
    <main class="game-app" aria-label="Snake Lab game">
      <div class="ambient-grid" aria-hidden="true"></div>
      <header class="titlebar">
        <a class="brand-link" href="index.html#fun-corner" aria-label="Back to fun corner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">SL</span>
            <span class="brand-title">
              <strong>Snake Lab</strong>
              <span class="document-name">Inefy fun corner / Grid run</span>
            </span>
          </div>
        </a>

        <nav class="game-nav" aria-label="Game page navigation">
          <a href="index.html#fun-corner">Fun corner</a>
          <button type="button" id="restartButton">Restart</button>
          <button type="button" id="pauseButton">Pause</button>
          <button class="nav-cta" type="button" id="fullscreenButton">Fullscreen</button>
        </nav>
      </header>

      <section class="game-hud" aria-label="Game status">
        <div class="hud-cluster">
          <div class="score-chip current">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="score-chip">
            <span>Best</span>
            <strong id="bestValue">0</strong>
          </div>
          <div class="score-chip">
            <span>Length</span>
            <strong id="lengthValue">4</strong>
          </div>
          <div class="score-chip pace">
            <span>Pace</span>
            <strong id="paceValue">1.0x</strong>
          </div>
        </div>
        <div class="hud-status">
          <span class="status-dot" aria-hidden="true"></span>
          <p class="round-status" id="roundStatus" aria-live="polite">Ready</p>
        </div>
      </section>

      <section class="game-stage-wrap" aria-label="Playfield">
        <div class="game-stage" id="gameStage">
          <canvas id="gameCanvas" aria-label="Snake Lab playfield"></canvas>
          <div class="game-menu" id="gameMenu">
            <div class="menu-card">
              <span class="menu-kicker">Precision grid run</span>
              <strong id="menuTitle">Snake Lab</strong>
              <span class="menu-meta" id="menuMeta">Best 0</span>
              <button class="menu-button" type="button" id="startButton">Start Run</button>
            </div>
          </div>
          <div class="touch-pad" aria-label="Touch direction controls">
            <button type="button" data-dir="up" aria-label="Move up">&uarr;</button>
            <button type="button" data-dir="left" aria-label="Move left">&larr;</button>
            <button type="button" data-dir="down" aria-label="Move down">&darr;</button>
            <button type="button" data-dir="right" aria-label="Move right">&rarr;</button>
          </div>
        </div>
      </section>
    </main>

    <script src="snake-lab.js"></script>
  </body>
</html>
