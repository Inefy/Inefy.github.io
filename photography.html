    <dialog class="photo-lightbox" data-photo-lightbox aria-label="Photo viewer">
      <div class="photo-lightbox__shell">
        <div class="photo-lightbox__toolbar">
          <p class="photo-lightbox__details" aria-live="polite">
            <strong data-photo-lightbox-title></strong>
            <span data-photo-lightbox-count></span>
          </p>
          <div class="photo-lightbox__actions">
            <button class="photo-lightbox__control" type="button" data-photo-previous aria-label="Previous photo">&#8592;</button>
            <button class="photo-lightbox__control photo-lightbox__zoom" type="button" data-photo-zoom aria-label="View photo at full size">Zoom in</button>
            <button class="photo-lightbox__control" type="button" data-photo-next aria-label="Next photo">&#8594;</button>
            <button class="photo-lightbox__control photo-lightbox__close" type="button" data-photo-close aria-label="Close photo viewer">&times;</button>
          </div>
        </div>
        <div class="photo-lightbox__viewport" data-photo-lightbox-viewport>
          <div class="photo-lightbox__canvas">
            <img class="photo-lightbox__image" data-photo-lightbox-image alt="" width="1682" height="1262" loading="eager" decoding="async" draggable="false">
          </div>
        </div>
      </div>
    </dialog>
