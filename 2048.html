<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="A polished 2048-style browser puzzle game from the Inefy fun corner.">
    <title>2048 / Inefy Fun Corner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5c45b'/%3E%3Crect x='12' y='12' width='18' height='18' rx='4' fill='%23070c10'/%3E%3Crect x='34' y='12' width='18' height='18' rx='4' fill='%2368b7ff'/%3E%3Crect x='12' y='34' width='18' height='18' rx='4' fill='%236de1a6'/%3E%3Crect x='34' y='34' width='18' height='18' rx='4' fill='%23ff7ac3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="2048.css">
  </head>
  <body>
    <main class="merge-app" aria-label="2048 game">
      <div class="ambient-grid" aria-hidden="true"></div>
      <header class="titlebar">
        <a class="brand-link" href="index.html#fun-corner" aria-label="Back to fun corner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">48</span>
            <span class="brand-title">
              <strong>2048</strong>
              <span class="document-name">Inefy fun corner / Tile merge</span>
            </span>
          </div>
        </a>

        <nav class="game-nav" aria-label="Game page navigation">
          <a href="index.html#fun-corner">Fun corner</a>
          <button type="button" id="undoButton">Undo</button>
          <button type="button" id="restartButton">Restart</button>
          <button class="nav-cta" type="button" id="fullscreenButton">Fullscreen</button>
        </nav>
      </header>

      <section class="game-hud" aria-label="Game status">
        <div class="hud-cluster">
          <div class="score-chip current">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="score-chip">
            <span>Best</span>
            <strong id="bestValue">0</strong>
          </div>
          <div class="score-chip">
            <span>Top Tile</span>
            <strong id="topTileValue">2</strong>
          </div>
          <div class="score-chip moves">
            <span>Moves</span>
            <strong id="movesValue">0</strong>
          </div>
        </div>
        <div class="hud-status">
          <span class="status-dot" aria-hidden="true"></span>
          <p class="round-status" id="roundStatus" aria-live="polite">Ready</p>
        </div>
      </section>

      <section class="game-stage-wrap" aria-label="Playfield">
        <div class="game-stage">
          <section class="merge-panel" aria-label="2048 board">
            <div class="merge-board" id="gameBoard" role="application" aria-label="2048 board, use arrow keys or swipe to move tiles" tabindex="0">
              <div class="board-grid" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="tile-layer" id="tileLayer" aria-hidden="true"></div>
              <div class="game-menu" id="gameMenu">
                <div class="menu-card">
                  <span class="menu-kicker">Number merge</span>
                  <div class="menu-tile-stack" aria-hidden="true">
                    <span>2</span>
                    <span>4</span>
                    <span>8</span>
                    <span>16</span>
                  </div>
                  <strong id="menuTitle">2048</strong>
                  <span class="menu-meta" id="menuMeta">Reach the luminous tile</span>
                  <button class="menu-button" type="button" id="startButton">Start Game</button>
                  <button class="menu-link" type="button" id="continueButton" hidden>Keep Going</button>
                </div>
              </div>
            </div>

            <div class="touch-pad" aria-label="Touch direction controls">
              <button type="button" data-dir="up" aria-label="Move up">&uarr;</button>
              <button type="button" data-dir="left" aria-label="Move left">&larr;</button>
              <button type="button" data-dir="down" aria-label="Move down">&darr;</button>
              <button type="button" data-dir="right" aria-label="Move right">&rarr;</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="2048.js"></script>
  </body>
</html>
